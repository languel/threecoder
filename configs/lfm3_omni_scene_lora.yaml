model: "LiquidAI/LFM3-Omni-2B-MLX-bf16"
trust_remote_code: true
train: true
fine_tune_type: "lora"
data: "data/lfm3_scene"
seed: 142
num_layers: -1
batch_size: 1
grad_accumulation_steps: 2
iters: 300
val_batches: 16
learning_rate: 6.0e-5
optimizer: "adamw"
optimizer_config:
  adamw:
    weight_decay: 0.01
lr_schedule:
  name: cosine_decay
  warmup: 10
  arguments: [6.0e-5, 290, 8.0e-6]
steps_per_report: 10
steps_per_eval: 50
save_every: 50
adapter_path: "adapters/lfm3-omni-2b-scene"
max_seq_length: 16384
grad_checkpoint: true
clear_cache_threshold: 4294967296
mask_prompt: true
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.0
