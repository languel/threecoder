<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brushed Gold Sphere on Dark Circular Stone Pedestal</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111318;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .toolbar {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 11px 16px;
      color: #f8f4e9;
      background: rgba(20, 22, 28, 0.82);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
      transition:
        transform 150ms ease,
        background 150ms ease,
        border-color 150ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(35, 37, 45, 0.94);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .title {
      position: fixed;
      left: 20px;
      bottom: 18px;
      z-index: 10;
      max-width: min(430px, calc(100vw - 40px));
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      line-height: 1.55;
      pointer-events: none;
    }

    .title strong {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .toolbar {
        top: 12px;
        right: 12px;
      }

      .title {
        left: 12px;
        bottom: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div class="toolbar">
    <button id="exportButton" type="button">Export GLB</button>
  </div>
  <div class="title">
    <strong>Brushed Gold Sphere</strong> on dark circular stone pedestal.<br />
    Drag to orbit · Scroll to zoom · Right-drag to pan
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x111318);
    scene.fog = new THREE.Fog(0x111318, 9, 18);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    );
    window.camera = camera;
    camera.position.set(4.25, 3.15, 5.35);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    window.renderer = renderer;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.12, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.1;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = environment;

    const ambientLight = new THREE.HemisphereLight(0xc9d7ef, 0x241b12, 1.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff0cf, 4.2);
    keyLight.position.set(4.5, 7.5, 4.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 4;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 15;
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xa8c9ff, 2.4);
    rimLight.position.set(-5, 3.8, -4.5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xffb85c, 16, 8, 2);
    fillLight.position.set(-2.5, 1.8, 2.8);
    scene.add(fillLight);

    // Exportable asset root.
    const assetRoot = new THREE.Group();
    assetRoot.name = "Brushed_Gold_Sphere_On_Pedestal";
    scene.add(assetRoot);

    const goldMaterial = new THREE.MeshStandardMaterial({
      name: "Brushed Gold",
      color: 0xb98a3d,
      metalness: 0.92,
      roughness: 0.29,
      flatShading: true
    });

    // A faceted sphere with restrained low-poly geometry.
    const sphereGeometry = new THREE.IcosahedronGeometry(1.58, 3);
    const spherePositions = sphereGeometry.attributes.position;

    for (let i = 0; i < spherePositions.count; i++) {
      const x = spherePositions.getX(i);
      const y = spherePositions.getY(i);
      const z = spherePositions.getZ(i);
      const radial = Math.hypot(x, y, z);

      if (radial > 0.0001) {
        const noise =
          1 +
          Math.sin(x * 4.1) * 0.012 +
          Math.sin(y * 5.7) * 0.009 +
          Math.cos(z * 3.3) * 0.014;
        spherePositions.setXYZ(i, x * noise, y * noise, z * noise);
      }
    }

    sphereGeometry.computeVertexNormals();

    const sphere = new THREE.Mesh(sphereGeometry, goldMaterial);
    sphere.name = "Brushed_Gold_Sphere";
    sphere.position.y = 1.69;
    sphere.castShadow = true;
    sphere.receiveShadow = true;
    assetRoot.add(sphere);

    // Dark circular stone pedestal.
    const stoneMaterial = new THREE.MeshStandardMaterial({
      name: "Dark Circular Stone",
      color: 0x292a2d,
      roughness: 0.9,
      metalness: 0.04,
      flatShading: true
    });

    const pedestal = new THREE.Group();
    pedestal.name = "Stone_Pedestal";
    assetRoot.add(pedestal);

    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(1.27, 1.34, 0.26, 32),
      stoneMaterial
    );
    base.position.y = 0.13;
    base.castShadow = true;
    base.receiveShadow = true;
    pedestal.add(base);

    const middle = new THREE.Mesh(
      new THREE.CylinderGeometry(1.08, 1.17, 0.24, 32),
      stoneMaterial
    );
    middle.position.y = 0.38;
    middle.castShadow = true;
    middle.receiveShadow = true;
    pedestal.add(middle);

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.93, 1.02, 0.14, 32),
      stoneMaterial
    );
    cap.position.y = 0.57;
    cap.castShadow = true;
    cap.receiveShadow = true;
    pedestal.add(cap);

    // A subtle inset band gives the pedestal a crafted, antique appearance.
    const insetMaterial = new THREE.MeshStandardMaterial({
      name: "Weathered Stone Inset",
      color: 0x36363a,
      roughness: 0.86,
      metalness: 0.03,
      flatShading: true
    });

    const inset = new THREE.Mesh(
      new THREE.CylinderGeometry(0.87, 0.91, 0.055, 32),
      insetMaterial
    );
    inset.position.y = 0.655;
    inset.castShadow = true;
    inset.receiveShadow = true;
    pedestal.add(inset);

    // Small irregular stone chips around the base.
    const chipGeometry = new THREE.DodecahedronGeometry(0.1, 0);
    const chipMaterial = new THREE.MeshStandardMaterial({
      name: "Stone Chips",
      color: 0x343438,
      roughness: 0.95,
      flatShading: true
    });

    const chipData = [
      [-1.18, 0.11, 0.52, 0.12],
      [1.16, 0.105, -0.56, 0.09],
      [-0.72, 0.09, -1.12, 0.08],
      [0.77, 0.095, 1.05, 0.11],
      [-1.34, 0.085, -0.22, 0.07]
    ];

    chipData.forEach(([x, y, z, size], index) => {
      const chip = new THREE.Mesh(chipGeometry, chipMaterial);
      chip.name = `Stone_Chip_${index + 1}`;
      chip.position.set(x, y, z);
      chip.scale.set(size / 0.1, size * 0.7, size);
      chip.rotation.set(index * 0.47, index * 0.83, index * 0.31);
      chip.castShadow = true;
      chip.receiveShadow = true;
      pedestal.add(chip);
    });

    // Ground is intentionally outside the exported asset.
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x17191e,
      roughness: 1,
      metalness: 0
    });

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    ground.receiveShadow = true;
    scene.add(ground);

    const backdrop = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({
        color: 0x17191e,
        roughness: 1
      })
    );
    backdrop.position.set(0, 3.4, -4.8);
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    const exportButton = document.getElementById("exportButton");

    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      exportButton.textContent = "Preparing…";

      try {
        const exporter = new GLTFExporter();
        const result = await exporter.parseAsync(assetRoot, {
          binary: true,
          onlyVisible: true,
          trs: false,
          includeCustomExtensions: false
        });

        const blob = new Blob([result], {
          type: "model/gltf-binary"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "brushed_gold_sphere_pedestal.glb";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        console.error("GLB export failed:", error);
        alert("The GLB could not be exported. Please check the browser console.");
      } finally {
        exportButton.disabled = false;
        exportButton.textContent = "Export GLB";
      }
    });
  </script>
</body>
</html>
