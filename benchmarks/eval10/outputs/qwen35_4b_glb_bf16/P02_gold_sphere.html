<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brushed Gold Sphere on Pedestal</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111318;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      max-width: min(390px, calc(100vw - 44px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(15, 17, 23, 0.82);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 6px;
      color: #f4eee1;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: #a8adb7;
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      color: #20180e;
      background: linear-gradient(180deg, #f8df9b, #c99a3d);
      box-shadow: 0 4px 14px rgba(185, 134, 42, 0.28);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.4);
      opacity: 0.7;
    }

    .hint {
      position: fixed;
      right: 20px;
      bottom: 16px;
      z-index: 10;
      color: rgba(220, 222, 229, 0.55);
      font-size: 12px;
      pointer-events: none;
    }

    #status {
      min-height: 18px;
      margin-top: 10px;
      color: #d6c58f;
      font-size: 12px;
    }

    @media (max-width: 560px) {
      .panel {
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: none;
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <div class="panel">
    <h1>Brushed Gold Sphere</h1>
    <p>
      A low-poly metallic gold sphere with a subtly irregular faceted surface,
      resting on a dark, subtly beveled stone pedestal.
    </p>

    <div class="controls">
      <button id="exportButton" type="button">Export GLB</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    // ------------------------------------------------------------
    // Renderer, camera, and presentation controls
    // ------------------------------------------------------------

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x111318);
    scene.fog = new THREE.Fog(0x111318, 10, 22);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;
    camera.position.set(4.8, 3.45, 5.7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    window.renderer = renderer;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 3.2;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI * 0.49;

    // ------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xb8c9e8, 0x252019, 1.6));

    const keyLight = new THREE.DirectionalLight(0xfff0cf, 4.2);
    keyLight.position.set(4.5, 7.5, 4.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x8eafff, 2.4);
    rimLight.position.set(-5, 4, -4);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xffb95c, 16, 10, 2);
    fillLight.position.set(-2.5, 2.3, 3.0);
    scene.add(fillLight);

    // ------------------------------------------------------------
    // Asset group: only this group is exported
    // ------------------------------------------------------------

    const asset = new THREE.Group();
    asset.name = "BrushedGoldSphereOnPedestal";
    scene.add(asset);

    // ------------------------------------------------------------
    // Materials
    // ------------------------------------------------------------

    const goldMaterial = new THREE.MeshStandardMaterial({
      name: "Brushed Gold",
      color: 0xffffff,
      vertexColors: true,
      metalness: 0.88,
      roughness: 0.27,
      flatShading: true,
      envMapIntensity: 1.4
    });

    const stoneMaterial = new THREE.MeshStandardMaterial({
      name: "Dark Circular Stone",
      color: 0x292b30,
      roughness: 0.94,
      metalness: 0.02,
      flatShading: true
    });

    const stoneTopMaterial = new THREE.MeshStandardMaterial({
      name: "Stone Upper Ring",
      color: 0x36383d,
      roughness: 0.9,
      metalness: 0.02,
      flatShading: true
    });

    const insetMaterial = new THREE.MeshStandardMaterial({
      name: "Stone Inset",
      color: 0x17191e,
      roughness: 0.96,
      metalness: 0.01,
      flatShading: true
    });

    // ------------------------------------------------------------
    // Pedestal geometry
    // ------------------------------------------------------------

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(1.72, 1.85, 0.34, 20, 1, false),
      stoneMaterial
    );
    pedestal.name = "Pedestal_Base";
    pedestal.position.y = 0.17;
    pedestal.castShadow = true;
    pedestal.receiveShadow = true;
    asset.add(pedestal);

    const pedestalTop = new THREE.Mesh(
      new THREE.CylinderGeometry(1.53, 1.64, 0.18, 20, 1, false),
      stoneTopMaterial
    );
    pedestalTop.name = "Pedestal_Top";
    pedestalTop.position.y = 0.47;
    pedestalTop.castShadow = true;
    pedestalTop.receiveShadow = true;
    asset.add(pedestalTop);

    const inset = new THREE.Mesh(
      new THREE.CylinderGeometry(1.34, 1.43, 0.055, 20, 1, false),
      insetMaterial
    );
    inset.name = "Pedestal_Inset";
    inset.position.y = 0.575;
    inset.receiveShadow = true;
    asset.add(inset);

    // A thin decorative separation ring.
    const separationRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.48, 0.025, 6, 32),
      new THREE.MeshStandardMaterial({
        color: 0x5f5b50,
        roughness: 0.72,
        metalness: 0.18
      })
    );
    separationRing.name = "Pedestal_Separation_Ring";
    separationRing.rotation.x = Math.PI / 2;
    separationRing.position.y = 0.56;
    separationRing.castShadow = true;
    asset.add(separationRing);

    // ------------------------------------------------------------
    // Procedural low-poly gold sphere
    // ------------------------------------------------------------

    const sphereGeometry = new THREE.IcosahedronGeometry(1.16, 3);
    const spherePositions = sphereGeometry.attributes.position;

    // Determine deterministic pseudo-random offsets for a hand-shaped
    // brushed surface while preserving the sphere's overall shape.
    const randomSeed = 82741;
    const random = () => {
      randomSeed =
        (randomSeed * 1664525 + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    };

    for (let i = 0; i < spherePositions.count; i++) {
      const x = spherePositions.getX(i);
      const y = spherePositions.getY(i);
      const z = spherePositions.getZ(i);

      const nx = x / 1.16;
      const ny = y / 1.16;
      const nz = z / 1.16;

      const broad = Math.sin(nx * 4.1 + ny * 2.7) * 0.025;
      const fine = (random() - 0.5) * 0.055;
      const ripple = Math.sin((nx + nz) * 8.5) * 0.012;

      spherePositions.setXYZ(
        i,
        x + broad + fine + ripple,
        y + broad * 0.7 + fine * 0.7 + ripple * 0.8,
        z + broad * 1.3 + fine * 1.1 + ripple
      );
    }

    spherePositions.needsUpdate = true;
    sphereGeometry.computeVertexNormals();

    // Assign subtle per-face gold variations for a hand-worked,
    // brushed-metal appearance.
    const colors = new Float32Array(spherePositions.count * 3);
    const color = new THREE.Color();

    for (let face = 0; face < spherePositions.count / 3; face++) {
      const index = face * 3;
      const lightness = 0.73 + random() * 0.16;
      const saturation = 0.78 + random() * 0.12;
      const hue = 0.115 + random() * 0.018;

      color.setHSL(hue, saturation, lightness);

      for (let vertex = 0; vertex < 3; vertex++) {
        const offset = (index + vertex) * 3;
        colors[offset] = color.r;
        colors[offset + 1] = color.g;
        colors[offset + 2] = color.b;
      }
    }

    sphereGeometry.setAttribute(
      "color",
      new THREE.BufferAttribute(colors, 3)
    );

    const goldSphere = new THREE.Mesh(sphereGeometry, goldMaterial);
    goldSphere.name = "Brushed_Gold_Sphere";
    goldSphere.castShadow = true;
    goldSphere.receiveShadow = true;
    asset.add(goldSphere);

    // Place the sphere so its bottom sits naturally on the pedestal.
    goldSphere.position.y = 1.52;

    // A small, subtle contact shadow receives the sphere's shadow.
    const contactShadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.96, 32),
      new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.28,
        depthWrite: false
      })
    );
    contactShadow.name = "Contact_Shadow";
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.612;
    contactShadow.scale.set(1.08, 0.92, 1);
    asset.add(contactShadow);

    // ------------------------------------------------------------
    // Ground plane for presentation only; not exported
    // ------------------------------------------------------------

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x15171b,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.012;
    ground.receiveShadow = true;
    scene.add(ground);

    // ------------------------------------------------------------
    // Export GLB
    // ------------------------------------------------------------

    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      try {
        const exporter = new GLTFExporter();
        const result = await exporter.parseAsync(asset, {
          binary: true,
          onlyVisible: true,
          trs: false,
          maxTextureSize: 4096
        });

        const blob = new Blob([result], {
          type: "model/gltf-binary"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "brushed-gold-sphere-on-pedestal.glb";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1500);

        status.textContent = "GLB exported successfully.";
      } catch (error) {
        console.error(error);
        status.textContent = "Export failed. See the browser console.";
      } finally {
        exportButton.disabled = false;
      }
    });

    // ------------------------------------------------------------
    // Resize and render loop
    // ------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
