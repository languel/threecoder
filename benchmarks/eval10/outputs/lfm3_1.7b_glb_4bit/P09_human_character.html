<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stylized Low-Poly Human Adventurer</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111820;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .hud {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 2;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(18, 25, 31, 0.78);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 5px;
      color: #ffd9a8;
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: #9fc0c4;
      font-size: 13px;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #e7a66f;
      box-shadow: 0 5px 14px rgba(255, 171, 102, 0.22);
      color: #21171d;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 120ms ease,
        background 120ms ease,
        opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #f4ca8b;
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #status {
      min-height: 16px;
      color: #9fc0c4;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 2;
      color: rgba(255, 235, 205, 0.72);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .hud {
        top: 12px;
        left: 12px;
      }

      .subtitle,
      #status {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="viewport"></div>

  <section class="hud">
    <h1>Stylized Adventurer</h1>
    <p class="subtitle">
      Low-poly character, idle breathing pose, subtle idle animation
    </p>

    <div class="actions">
      <button id="exportButton" type="button">Export GLB</button>
      <span id="status">Preparing the GLB…</span>
    </div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

      window.innerWidth / window.innerHeight,
      0.1,

    window.camera = camera;

    camera.position.set(6.7, 4.5, 8.7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    function addMesh(geometry, material, parent, name) {
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(name, size, position, material, parent, rotation = [0, 0, 0]) {
      return addMesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        parent,
        name
      );
    }

    function cylinder(
      name,
      radius,
      height,
      position,
      material,
      parent,
      rotation = [0, 0, 0],
      segments = 12
    ) {
      return addMesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material,
        parent,
        name
      );
    }

    function makeRoundedRectangle(
      name,
      size,
      position,
      material,
      radius = 0.025,
      parent,
      rotation = [0, 0, 0]
    ) {
      return addMesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        parent,
        name
      );
    }

    function makeCylinderBetween(name, start, end, radius, material, parent, segments = 8) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      if (length < 0.00001) return null;

      const object = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );

      object.name = name;
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }
