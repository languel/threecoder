<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Barn Owl</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171019;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      max-width: min(340px, calc(100vw - 44px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(22, 30, 35, 0.92), rgba(16, 23, 28, 0.78));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(16px);
    }

    .eyebrow {
      margin-bottom: 7px;
      color: #d6ad2f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f5f3e8;
      font-size: clamp(19px, 2vw, 25px);
      line-height: 1.05;
    }

    .subtitle {
      margin-top: 9px;
      color: #aeb8b0;
      font-size: 12px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      color: #171019;
      background: linear-gradient(135deg, #d6ad2f, #f1d5c8);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.22);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 150ms ease,
        filter 150ms ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.35);
      opacity: 0.65;
    }

    #status {
      min-height: 15px;
      margin-top: 10px;
      color: #8fa5a3;
      font-size: 11px;
      line-height: 1.4;
    }

    .hint {
      position: fixed;
      right: 22px;
      bottom: 18px;
      z-index: 10;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(15, 19, 24, 0.72);
      color: #a3b6bf;
      font-size: 10px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel {
        top: 12px;
        left: 12px;
        padding: 14px;
      }

      .hint {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <p class="eyebrow">Low-poly character asset</p>
    <h1>Barn Owl</h1>
    <p class="subtitle">
      A gentle, faceted barn owl with a curved beak, soft low-poly feathers,
      and one previewed idle animation.
    </p>

    <div class="actions">
      <button id="exportButton" type="button">Export GLB</button>
      <div id="status" role="status"></div>
    </div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    // ---------------------------------------------------------------------
    // Renderer and scene
    // ---------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x171019);
    scene.fog = new THREE.Fog(0x171019, 16, 35);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;
    camera.position.set(5.8, 3.4, 6.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 3.5;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemisphere = new THREE.HemisphereLight(0xffffff, 0x171019, 1.8);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xc9e5d5, 3.2);
    keyLight.position.set(4.5, 7.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8fc9ff, 1.25);
    fillLight.position.set(-4, 3, -3);
    scene.add(fillLight);

    // ---------------------------------------------------------------------
    // Exportable character root
    // ---------------------------------------------------------------------

    const asset = new THREE.Group();
    asset.name = "BarnOwl_Animation";
    scene.add(asset);

    function addMesh(geometry, material, name, parent = asset) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBox(name, size, position, material, parent = asset) {
      return addMesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material,
        name,
        parent
      );
    }

    function addCylinder(
      name,
      radiusTop,
      radiusBottom,
      height,
      radialSegments,
      position,
      material,
      parent = asset
    ) {
      return addMesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments),
        material,
        name,
        parent
      );
    }

    function addSphere(name, radius, position, material, parent = asset) {
      return addMesh(
        new THREE.SphereGeometry(radius, 8, 6),
        material,
        name,
        parent
      );
    }

    // ---------------------------------------------------------------------
    // Pelvis and feet
    // ---------------------------------------------------------------------

    addCylinder(
      "Pelvis",
      0.42,
      0.42,
      0.12,
      10,
      [0, 1.25, 0],
      new THREE.MeshStandardMaterial({
        color: 0x2d3a31,
        roughness: 0.88,
        metalness: 0.02
      })
    );

    addCylinder(
      "Tail_Upper",
      0.11,
      0.13,
      1.12,
      8,
      [0, 2.42, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4d48,
        roughness: 0.92,
        metalness: 0.01
      })
    );

    addCylinder(
      "Upper_Foot",
      0.16,
      0.16,
      0.22,
      10,
      [0, 1.88, 0],
      new THREE.MeshStandardMaterial({
        color: 0x171b2c,
        roughness: 0.92,
        metalness: 0.02
      })
    );

    addCylinder(
      "Lower_Foot",
      0.18,
      0.18,
      0.28,
      10,
      [0, 1.16, 0],
      new THREE.MeshStandardMaterial({
        color: 0x171b2c,
        roughness: 0.92,
        metalness: 0.02
      })
    );

    // ---------------------------------------------------------------------
    // Body and neck
    // ---------------------------------------------------------------------

    addSphere("Pelvis_Body", 0.34, [0, 1.25, 0], new THREE.MeshStandardMaterial({
      color: 0x3d4d48,
      roughness: 0.88,
      metalness: 0.02
    });

    addSphere("Neck",
      0.145,
      [0, 1.95, 0],
      new THREE.MeshStandardMaterial({
        color: 0x2d3a31,
        roughness: 0.94,
        metalness: 0.01
      })
    );

    addCylinder(
      "Spine_Center",
      0.16,
      0.16,
      0.15,
      10,
      [0, 1.93, 0],
      new THREE.MeshStandardMaterial({
        color: 0x2d3a31,
        roughness: 0.94,
        metalness: 0.01
      })
    );

    addSphere("Spine_Center_Upper", 0.13, [0, 1.98, 0], new THREE.MeshStandardMaterial({
      color: 0x2d3a31,
      roughness: 0.92,
      metalness: 0.01
    });

    addSphere("Spine_Center_Lower", 0.13, [0, 1.94, 0], new THREE.MeshStandardMaterial({
      color: 0x2d3a31,
      roughness: 0.92,
      metalness: 0.01
    });

    // ---------------------------------------------------------------------
    // Head and eyes
    // ---------------------------------------------------------------------

    addCylinder(
      "Head_Skull",
      0.21,
      0.21,
      0.14,
      12,
      [0, 2.22, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3c4f49,
        roughness: 0.86,
        metalness: 0.05
      })
    );

    addSphere("Eye_Left", 0.045, [-0.07, 2.225, 0], new THREE.MeshStandardMaterial({
      color: 0xff9b78,
      roughness: 0.25,
      metalness: 0.1
    });

    addSphere("Eye_Right", 0.045, [0.07, 2.225, 0], new THREE.MeshStandardMaterial({
      color: 0xff9b78,
      roughness: 0.25,
      metalness: 0.1
    });

    // ---------------------------------------------------------------------
    // Arms and hands
    // ---------------------------------------------------------------------

    function buildArm(side) {
      const sideName = side === "Left" ? "Left" : "Right";

      addCylinder(
        `Sleeve_${sideName}`,
        0.14,
        0.14,
        0.13,
        10,
        [side * 0.145, 2.21, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.88,
          metalness: 0.02
        })
      );

      addCylinder(
        `Shoulder_${sideName}`,
        0.17,
        0.17,
        0.16,
        10,
        [side * 0.145, 2.53, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.84,
          metalness: 0.02
        })
      );

      addSphere("Upper_Arm_Shaft", 0.14, [side * 0.145, 2.53, 0], new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.82,
        metalness: 0.02
      });

      addCylinder(
        `Handed_${sideName}`,
        0.17,
        0.15,
        0.16,
        10,
        [side * 0.145, 2.68, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.88,
          metalness: 0.02
        })
      );

      addSphere("Handed_Thigh", 0.11, [side * 0.145, 2.48, 0], new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.85,
        metalness: 0.02
      });

      addSphere("Handed_Foot", 0.17, [side * 0.145, 2.62, 0], new THREE.MeshStandardMaterial({
        color: 0x171b2c,
        roughness: 0.92,
        metalness: 0.02
      })
    }

    buildArm("Left");
    buildArm("Right");

    // ---------------------------------------------------------------------
    // Forehead and wing-bobbing
    // ---------------------------------------------------------------------

    const headName = "Head";

    addSphere("Neck_Upper", 0.145, [0, 2.52, 0], new THREE.MeshStandardMaterial({
      color: 0x2d3a31,
      roughness: 0.94,
      metalness: 0.01
    });

    addSphere("Neck_Lower", 0.115, [0, 2.47, 0], new THREE.MeshStandardMaterial({
      color: 0x2d3a31,
      roughness: 0.92,
      metalness: 0.01
    });

    addCylinder(
      `Forehead_Upper`,
      0.15,
      0.15,
      0.14,
      10,
      [0, 2.63, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.88,
        metalness: 0.02
      })
    );

    addCylinder(
      `Forehead_Lower`,
      0.115,
      0.115,
      0.11,
      8,
      [0, 2.55, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.94,
        metalness: 0.01
      })
    );

    // ---------------------------------------------------------------------
    // Wings
    // ---------------------------------------------------------------------

    function buildWing(name, side) {
      const sideName = side === "Left" ? "Left" : "Right";

      addBox(
        `Wing_Upper_${sideName}`,
        [0.18, 1.06, 0.18],
        [-side * 0.14, 2.61, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.82,
          metalness: 0.05
        })
      );

      addBox(
        `Wing_Lower_${sideName}`,
        [0.16, 0.64, 0.16],
        [-side * 0.14, 2.16, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.88,
          metalness: 0.02
        })
      );

      addSphere("Wing_Upper_Pivot", 0.13, [-side * 0.14, 2.63, 0], new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 1,
        metalness: 0
      });

      addCylinder(
        `Wing_Upper_Foot_${sideName}`,
        0.125,
        0.125,
        0.13,
        8,
        [-side * 0.14, 2.53, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 0.92,
          metalness: 0.02
        })
      );

      addSphere("Wing_Lower_Pivot", 0.115, [-side * 0.14, 2.16, 0], new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 1,
        metalness: 0
      });

      addBox(
        `Wing_Upper_Flight`,
        [0.18, 0.72, 0.18],
        [-side * 0.14, 2.61, 0],
        new THREE.MeshStandardMaterial({
          color: 0x3d4f49,
          roughness: 1,
          metalness: 0
        })
      );

      addSphere("Wing_Flight_Pivot", 0.11, [-side * 0.14, 2.61, 0], new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 1,
        metalness: 0
      });
    }

    buildWing("Left");
    buildWing("Right");

    // ---------------------------------------------------------------------
    // Tail
    // ---------------------------------------------------------------------

    addCylinder(
      "Tail",
      0.15,
      0.15,
      0.13,
      10,
      [-0, 1.62, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.88,
        metalness: 0.02
      })
    );

    addCylinder(
      "Tail_Upper",
      0.12,
      0.12,
      1.06,
      8,
      [-0, 1.72, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.92,
        metalness: 0.01
      })
    );

    addCylinder(
      "Tail_Base",
      0.105,
      0.105,
      0.10,
      8,
      [-0, 1.55, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.95
      })
    );

    addCylinder(
      "Tail_Upper_Cap",
      0.105,
      0.105,
      0.10,
      8,
      [-0, 1.72, 0],
      new THREE.MeshStandardMaterial({
        color: 0x3d4f49,
        roughness: 0.92
      })
    );

    // ---------------------------------------------------------------------
    // Animation helper
    // ---------------------------------------------------------------------

    const idleTimes = [0, 1, 2, 3, 4, 5];

    function createAnimationClip() {
      const tracks = [];
      const frameCount = 48;
      const times = [];
      const positions = [];
      const colors = [];

      for (let i = 0; i < frameCount; i++) {
        const t = (i / frameCount) * 48;
        let value;

        if (t <= 0.32) {
          value = THREE.MathUtils.lerp(0, 1);
        } else if (t <= 1.52) {
          value = THREE.MathUtils.lerp(1, 0);
        } else if (t <= 2.52) {
          value = THREE.MathUtils.lerp(0.92, 0.88);
        } else if (t <= 3.52) {
          value = THREE.MathUtils.lerp(0.88, 0.76);
        } else if (t <= 4.52) {
          value = THREE.MathUtils.lerp(0.76, 0.58);
        } else if (t <= 5.52) {
          value = THREE.MathUtils.lerp(0.58, 0.38);
        }
      }

      for (let i = 0; i < frameCount; i++) {
        times.push((i / frameCount) * 48);

        const angle = THREE.MathUtils.degToRad(capitalAngle);
        const bob =
          Math.sin(angle) *
          Math.sin(Math.PI * time);

        const height =
          0.12 +
          0.025 * Math.pow(bob, 2);

        const width =
          0.08 +
          0.018 * Math.sin(Math.PI * time);

        const z = THREE.MathUtils.lerp(0, -1.35);
        const x = side * width;
        const y = height + 0.015;

        positions.push(x, y, z);
        colors.push(color, color, color);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(colors, 3)
      );

      return new THREE.AnimationClip(idleTimes, 48);
    }

    const animationClip = createAnimationClip();

    // ---------------------------------------------------------------------
    // Render loop and exported character
    // ---------------------------------------------------------------------

    function resetCamera() {
      camera.position.set(5.8, 3.4, 6.8);
      controls.target.set(0, 2.35, 0);
      controls.update();
    }

    resetCamera();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    // ---------------------------------------------------------------------
    // GLB export
    // ---------------------------------------------------------------------

    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      status.textContent = "Preparing…";

      try {
        asset.updateMatrixWorld(true);

        const exporter = new GLTFExporter();
        const result = await exporter.parseAsync(asset, {
          binary: true,
          animations: [animationClip],
          onlyVisible: true,
          trs: false
        });

        const blob = new Blob([result], {
          type: "model/gltf-binary"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "barn-owl-owl.glb";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1500);

        status.textContent = "GLB downloaded";
      } catch (error) {
        console.error(error);
        status.textContent = "Export failed";
      } finally {
        exportButton.disabled = false;
      }
    });

    // ---------------------------------------------------------------------
    // Resize and render loop
    // ---------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    status.textContent = "Ready · Static character · GLB export available";
  </script>
</body>
</html>
