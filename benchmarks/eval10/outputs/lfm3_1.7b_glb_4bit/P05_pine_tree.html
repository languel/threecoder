<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Evergreen Pine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, #3d5f7e 0%, #2d4d57 42%, #1a2d35 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .info {
      position: fixed;
      top: 24px;
      left: 24px;
      padding: 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(16, 20, 25, 0.82);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: #d8a66c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 3vw, 30px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;
      color: #6f8b9d;
      font-size: 13px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .tag {
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #7f9a99;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #export-button {
      position: fixed;
      top: 26px;
      right: 24px;
      min-width: 160px;
      padding: 12px 16px;
      border: 1px solid #d8a66c;
      border-radius: 10px;
      background: linear-gradient(135deg, #d9ad6d, #b77a43);
      box-shadow: 0 7px 20px rgba(109, 115, 56, 0.22);
      color: #fff8e8;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    #export-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    #export-button:active {
      transform: translateY(0);
    }

    #export-button:disabled {
      cursor: wait;
      filter: grayscale(0.25);
      opacity: 0.65;
    }

    .hint {
      position: fixed;
      right: 25px;
      bottom: 22px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .info {
        top: 16px;
        left: 16px;
      }

      .hint {
        right: 16px;
        bottom: 16px;
    }
  </style>
</head>

<body>
  <div id="viewport"></div>

  <section class="info">
    <p class="eyebrow">Low-poly game asset</p>
    <h1>Evergreen Pine</h1>
    <div class="subtitle">Tapered bark · four snow-dusted cones · mossy patch</div>
    <div class="tags">
      <span class="tag">Static</span>
      <span class="tag">Low-poly</span>
      <span class="tag">GLB ready</span>
      <span class="tag">Game asset</span>
    </div>
  </section>

  <button id="export-button" type="button">Export GLB</button>
  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</body>
</html>
