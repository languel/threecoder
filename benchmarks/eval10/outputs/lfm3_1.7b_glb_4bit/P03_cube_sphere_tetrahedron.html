<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crimson Cube — GLB Asset</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101820;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    .panel {
      position: fixed;
      top: 22px;
      left: 24px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 48px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      background: linear-gradient(
        145deg,
        rgba(17, 23, 30, 0.9),
        rgba(20, 27, 35, 0.72)
      );
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #d8b96c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 3vw, 32px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #a8c1b2;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      color: #151719;
      background: linear-gradient(135deg, #d6b88f, #c98a1e);
      box-shadow:
        0 8px 20px rgba(218, 140, 80, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.01em;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(135deg, #e5a85f, #d9bb64);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    #status {
      min-height: 15px;
      color: #a8c1b2;
      font-size: 11px;
      line-height: 1.45;
    }

    .hint {
      position: fixed;
      right: 22px;
      bottom: 20px;
      z-index: 10;
      padding: 8px 11px;
      border-radius: 9px;
      background: rgba(17, 23, 30, 0.55);
      color: #a9b4b2;
      font-size: 11px;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 700px) {
      .panel {
        top: 16px;
        left: 16px;
        max-width: calc(100vw - 32px);
      }

      #status {
        font-size: 10px;
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <p class="eyebrow">Low-poly asset · Game-ready export</p>
    <h1>Crimson Cube</h1>
    <p class="subtitle">
      Matte crimson cube with faceted geometry, a glossy cobalt sphere,
      and an emerald tetrahedron arranged side by side.
    </p>

    <div class="actions">
      <button id="exportButton" type="button">Export GLB</button>
      <div id="status">Static asset · 3 materials · 1 animation</div>
    </div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    // ---------------------------------------------------------------------
    // Renderer and scene
    // ---------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x101820);
    scene.fog = new THREE.Fog(0x101820, 10, 18);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    const initialCameraPosition = new THREE.Vector3(5.5, 4.1, 6.4);
    const initialTarget = new THREE.Vector3(0, 2.35, 0);

    camera.position.copy(initialCameraPosition);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(initialTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3.5;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    // ---------------------------------------------------------------------
    // Lighting
    // ---------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xc9d4ff, 0x24191e, 1.15));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(4.5, 7, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4c8bff, 1.25);
    rimLight.position.set(-5, 3, -4);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xff9b42, 18, 8, 2);
    warmFill.position.set(-2.5, 4.5, 5);
    scene.add(warmFill);

    // ---------------------------------------------------------------------
    // Exportable materials
    // ---------------------------------------------------------------------

    const materials = {
      material: (name) => new THREE.MeshStandardMaterial({
        name,
        vertexColors: true,
        color: name === "matte_crimson" ? 0x9d2c1d : 0xffffff,
        roughness: 0.78,
        metalness: 0,
        flatShading: true
      }),
      material: (name) => new THREE.MeshStandardMaterial({
        name,
        vertexColors: true,
        color: name === "cobalt_sphere" ? 0x3d6bff : 0xffd1a1,
        roughness: 0.58,
        metalness: 0,
        flatShading: true
      }),
      material: (name) => new THREE.MeshStandardMaterial({
        name,
        vertexColors: true,
        color: name === "emerald_tetrahedron" ? 0x2f7b3d : 0x1e4f3b,
        roughness: 0.62,
        metalness: 0,
        flatShading: true
      })
    };

    const cubeMaterial = materials.material;
    const sphereMaterial = materials.material;
    const tetrahedronMaterial = materials.material;

    // ---------------------------------------------------------------------
    // Asset hierarchy
    // ---------------------------------------------------------------------

    const assetRoot = new THREE.Group();
    assetRoot.name = "CrimsonCube_Asset";
    scene.add(assetRoot);

    // Main plinth and dark base.
    const plinth = new THREE.Group();
    plinth.name = "Dark_Plinth";
    assetRoot.add(plinth);

    const plinthBase = new THREE.BoxGeometry(2.25, 0.18, 1.58);
    const plinthTop = new THREE.Vector3(0, 2.16, 0);

    const base = new THREE.Mesh(plinthBase, cubeMaterial);
    base.position.y = plinthTop.y;
    base.castShadow = true;
    base.receiveShadow = true;
    plinth.add(base);

    const baseInset = new THREE.BoxGeometry(1.94, 0.16, 1.44);
    const baseInsetMaterial = cubeMaterial.clone();
    const baseInsetShadow = baseInset.toUnlit;

    const baseCollar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.12, 8),
      baseInset
    );
    baseCollar.position.y = 2.13;
    baseCollar.castShadow = true;
    baseCollar.receiveShadow = true;
    plinth.add(baseCollar);

    // ---------------------------------------------------------------------
    // Main cube
    // ---------------------------------------------------------------------

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(2.16, 1.18, 1.8),
      cubeMaterial
    );

    const cubePosition = new THREE.Vector3(0, 1.08, 0);
    const cubeRotation = new THREE.Euler(Math.PI / 4, 0, 0);
    cube.position.copy(cubePosition);
    cube.castShadow = true;
    cube.receiveShadow = true;
    assetRoot.add(cube);

    // Side and end plates.
    const sidePlate = new THREE.Mesh(
      new THREE.BoxGeometry(2.16, 0.16, 1.8),
      materials.material
    );
    sidePlate.position.set(1.58, 1.04, 0);
    sidePlate.rotation.x = Math.PI / 2;
    sidePlate.castShadow = true;
    assetRoot.add(sidePlate);

    const endPlate = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1.18, 1.8),
      materials.material
    );
    endPlate.position.set(0, 1.08, 0);
    endPlate.rotation.x = Math.PI / 2;
    endPlate.castShadow = true;
    assetRoot.add(endPlate);

    // ---------------------------------------------------------------------
    // Glossy cobalt sphere
    // ---------------------------------------------------------------------

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.15, 12, 8),
      sphereMaterial
    );

    sphere.position.set(0, 2.06, 0);
    sphere.scale.set(1.25, 1, 1);
    sphere.rotation.x = Math.PI / 4;
    sphere.castShadow = true;
    assetRoot.add(sphere);

    const sphereDetails = [
      { name: "Cobalt_Surface_Highlight", color: 0x48dfff },
      { name: "Cobalt_Surface_Lowlight", color: 0x2e9cff },
      { name: "Cobalt_Core", color: 0x1b8aff }
    ];

    const sphereDetailsArray = sphereDetails.map((detail) => {
      return new THREE.Mesh(1, detail.color, 1);
    });

    sphereDetailsArray.forEach((mesh, index) => {
      mesh.name = detail.name;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      assetRoot.add(mesh);
    });

    // ---------------------------------------------------------------------
    // Emerald tetrahedron
    // ---------------------------------------------------------------------

    var tetrahedron = new THREE.Group();
    tetrahedron.name = "Emerald_Tetrahedron";
    assetRoot.add(tetrahedron);

    const basePoint = new THREE.Vector3(0, 2.06, 0);
    const baseTop = new THREE.Vector3(0, 2.16, 0);

    // Low-poly triangular geometry.
    const trianglePositions = [
      { x: -0.12, z: 0.16 },
      { x: 0.12, z: 0.16 },
      { x: 0.12, z: -0.16 },
      { x: -0.12, z: -0.16 }
    ];

    const positions = [];
    const colors = [];

    for (const trianglePosition of trianglePositions) {
      for (let i = 0; i < 3; i++) {
        positions.push(
          trianglePosition.x,
          trianglePosition.z,
          new THREE.Vector3(0, -0.02, 0)
        );
      }
    }

    for (const trianglePosition of trianglePositions) {
      for (let i = 0; i < 3; i++) {
        colors.push(
          trianglePosition.color,
          0,
          0
        );
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(positions, 3)
    );
    geometry.setAttribute(
      "color",
      new THREE.Float32Attribute(colors, 3)
    );
    geometry.computeVertexNormals();

    var tetrahedron = new THREE.Mesh(geometry, tetrahedronMaterial);
    tetrahedron.name = "Emerald_Tetrahedron";
    tetrahedron.position.copy(basePoint);
    tetrahedron.scale.set(0.72, 1, 0.72);
    tetrahedron.castShadow = true;
    tetrahedron.receiveShadow = true;
    tetrahedron.add(tetrahedron);

    // ---------------------------------------------------------------------
    // Export
    // ---------------------------------------------------------------------

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Building GLB…";

      const exporter = new GLTFExporter();

      exporter.parse(
        assetRoot,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "crimson_cube.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          exportButton.disabled = false;
          status.textContent = "Exported crimson_cube.glb · Static asset";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed — see browser console";
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false
        }
      );
    });

    // ---------------------------------------------------------------------
    // Resize and render loop
    // ---------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
