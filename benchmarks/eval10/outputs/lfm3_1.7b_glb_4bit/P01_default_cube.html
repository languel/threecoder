<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Default Cube Asset</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9d1c1;
      color: #fff1e8;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .info {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      pointer-events: none;
    }

    .info h1 {
      margin: 0 0 8px;
      font-size: clamp(19px, 2vw, 29px);
      letter-spacing: -0.04em;
    }

    .info p {
      margin: 0;
      color: #d9d1c1;
      font-size: 13px;
    }

    #exportButton {
      display: flex;
      align-items: center;
      justify-content: center: center;
      gap: 10px;
      padding: 12px 18px;
      border: 1px solid #f4dfb6;
      border-radius: 8px;
      background: #fff7d9;
      box-shadow: 0 3px 12px rgb(255,233,189 / 18%);
      color: #21191a;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    #exportButton:hover {
      transform: translateY(-1px);
      background: #fff3df;
    }

    #exportButton:active {
      transform: translateY(0);
    }

    #exportButton:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #status {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 10;
      color: #d9d1c1;
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .info p {
        display: none;
      }

      #exportButton {
        flex-direction: column;
      }

      #status {
        right: 16px;
        bottom: 14px;
      }
    }
  </style>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.querySelector("#viewport");
    var exportButton = document.querySelector("#exportButton");
    const status = document.querySelector("#status");

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0xd9d1c1);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;
    camera.position.set(5.4, 3.8, 6.6);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = false;
    controls.minDistance = 4.5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const hemisphere = new THREE.HemisphereLight(0xffffff, 0x9ca8a0, 2.25);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xfff1df, 3.1);
    keyLight.position.set(4.5, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd9efb4, 1.35);
    fillLight.position.set(-5, 3.5, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.1);
    rimLight.position.set(2, 4, -5);
    scene.add(rimLight);

    // Neutral ground plane is presentation-only and is not included in the GLB.
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0xd9d1c1,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.012;
    ground.receiveShadow = true;
    scene.add(ground);

    const asset = new THREE.Group();
    asset.name = "CubeAsset";
    asset.userData = {
      assetType: "Static low-poly cube",
      material: "Grey-orange beveled",
      dimensions: "1 meter × 1 meter × 1 meter"
    };
    scene.add(asset);

    const baseMaterial = new THREE.MeshStandardMaterial({
      name: "GreyOrangeBeveled",
      color: 0x9ba1a7,
      roughness: 0.62,
      metalness: 0,
      side: THREE.DoubleSide
    });

    const faceMaterial = new THREE.MeshStandardMaterial({
      name: "Rounded_GreyOrange",
      color: 0xb0c8c1,
      roughness: 0.48,
      metalness: 0,
      side: THREE.DoubleSide
    });

    const edgeMaterial = new THREE.MeshStandardMaterial({
      name: "Beveled_Edge",
      color: 0xffffff,
      roughness: 0.36,
      metalness: 0,
      side: THREE.DoubleSide
    });

    function addMesh(geometry, material, name, parent = asset) {
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function addBox(
      name,
      size,
      position,
      material,
      parent = asset
    ) {
      return addMesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material,
        name,
        parent
      );
    }

    function addCylinder(
      name,
      radiusTop,
      radiusBottom,
      height,
      segments,
      position,
      material,
      parent = asset
    ) {
      return addMesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material,
        name,
        parent
      );
    }

    function addBeamBetween(
      name,
      start,
      end,
      width,
      depth,
      material,
      parent = asset
    ) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const length = direction.length();

      const geometry = new THREE.BoxGeometry(width, length, depth);
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function addCylinderBetween(
      name,
      start,
      end,
      radius,
      material,
      parent = asset
    ) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const length = direction.length();

      const geometry = new THREE.CylinderGeometry(radius, radius, length, 12);
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function createFrontBeam(name, top, bottom, width, depth, material) {
      addCylinder(
        name,
        width,
        width,
        0.06,
        6,
        [0, top, 0],
        material
      );

      addCylinder(
        name,
        width,
        width,
        0.12,
        6,
        [0, bottom, 0],
        material
      );
    }

    function createSideBeam(name, x, top, bottom, width, depth, material) {
      addCylinder(
        name,
        width,
        width,
        0.06,
        6,
        [x, top, 0],
        material
      );

      addCylinder(
        name,
        width,
        width,
        0.12,
        6,
        [x, bottom, 0],
        material
      );
    }

    // Main cube with four beveled edges.
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      faceMaterial
    );

    // Front and back faces.
    createFrontBeam("Front_Face", [0, 1.05, -0.52], [0, 1.05, 0.52], 1, 1, baseMaterial);
    createFrontBeam("Back_Face", [0, 1.05, 0.52], [0, 1.05, -0.52], 1, 1, baseMaterial);

    // Side faces.
    for (const side of [-1, 1]) {
      createSideBeam(
        side > 0 ? "Right_Side_Face" : "Left_Side_Face",
        side * 0.52,
        1.05,
        0.52,
        1,
        1,
        edgeMaterial
      );
    }

    // Front and back bevels.
    createFrontBeam("Front_Bevel", [0, 1.05, -0.52], [0, 1.05, 0.52], 0.72, 0.72, faceMaterial);
    createFrontBeam("Back_Bevel", [0, 1.05, 0.52], [0, 1.05, -0.52], 0.72, 0.72, faceMaterial);

    // Side bevels.
    for (const side of [-1, 1]) {
      createSideBeam(
        side > 0 ? "Right_Side_Bevel" : "Left_Side_Bevel",
        side * 0.52,
        1.05,
        0.52,
        0.72,
        0.72,
        edgeMaterial
      );
    }

    // Lower cube edges.
    for (const side of [-1, 1]) {
      createSideBeam(
        side > 0 ? "Right_Lower_Bevel" : "Left_Lower_Bevel",
        side * 0.52,
        [0, -1.05, 0],
        1.05,
        0.72,
        faceMaterial
      );

      createFrontBeam(
        side > 0 ? "Right_Front_Bevel" : "Left_Front_Bevel",
        side * 0.52,
        [0, -1.05, 0.52],
        0.72,
        0.72,
        faceMaterial
      );
    }

    // Front corner details.
    for (const side of [-1, 1]) {
      addBeamBetween(
        side > 0 ? "Right_Front_Corner" : "Left_Front_Corner",
        [side * 0.52, -1.05, 0.47],
        [side * 0.52, -1.05, 0.47],
        0.18,
        0.18,
        faceMaterial
      );

      addBeamBetween(
        side > 0 ? "Right_Front_Corner" : "Left_Front_Corner",
        [side * 0.52, -1.05, -0.47],
        [side * 0.52, -1.05, -0.47],
        0.18,
        0.18,
        faceMaterial
      );
    }

    // Main cube.
    addCylinder(
      "Cube_Geometry",
      1,
      1,
      1,
      12,
      [0, 1.05, 0],
      baseMaterial
    );

    // Side cube edges.
    for (const side of [-1, 1]) {
      addCylinder(
        side > 0 ? "Right_Side_Cube" : "Left_Side_Cube",
        1,
        1,
        1,
        12,
        [side * 0.52, 1.05, 0],
        baseMaterial
      );

      addCylinder(
        side > 0 ? "Right_Side_Cube_Upper" : "Left_Side_Cube_Lower",
        1,
        1,
        0.06,
        12,
        [side * 0.52, 1.05, 0],
        baseMaterial
      );
    }

    // Beveled edges.
    for (const side of [-1, 1]) {
      addCylinder(
        side > 0 ? "Right_Bottom_Bevel" : "Left_Bottom_Bevel",
        1,
        1,
        0.12,
        6,
        [side * 0.52, -1.05, 0],
        baseMaterial
      );
    }

    // Top and bottom bevels.
    for (const side of [-1, 1]) {
      addCylinder(
        side > 0 ? "Right_Top_Bevel" : "Left_Top_Bevel",
        1,
        1,
        0.12,
        6,
        [side * 0.52, 1.05, 0],
        baseMaterial
      );
    }

    // Bottom and top faces.
    addCylinder(
      "Bottom_Face",
      1,
      1,
      0.06,
      12,
      [0, -1.05, 0],
      faceMaterial
    );

    addCylinder(
      "Top_Face",
      1,
      1,
      0.06,
      12,
      [0, 1.05, 0],
      faceMaterial
    );

    // Small corner trim pieces.
    for (const side of [-1, 1]) {
      addCylinder(
        side > 0 ? "Right_Top_Bevel_Upper" : "Left_Top_Bevel_Lower",
        0.14,
        0.14,
        0.18,
        6,
        [side * 0.52, 1.05, 0],
        edgeMaterial
      );

      addCylinder(
        side > 0 ? "Right_Top_Bevel_Lower" : "Left_Top_Bevel_Lower",
        0.14,
        0.14,
        0.18,
        6,
        [side * 0.52, -1.05, 0],
        edgeMaterial
      );
    }

    // Ground plane.
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xd9d1c1,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.012;
    ground.receiveShadow = true;
    scene.add(ground);

    var exportButton = new THREE.DomElement(exportButton);
    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      try {
        asset.updateMatrixWorld(true);

        const exporter = new GLTFExporter();
        const result = await exporter.parseAsync(asset, {
          binary: true,
          onlyVisible: true,
          trs: false
        });

        const blob = new Blob([result], {
          type: "model/gltf-binary"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "default-cube.glb";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        status.textContent = "GLB exported successfully";
      } catch (error) {
        console.error("GLB export failed:", error);
        status.textContent = "Export failed — see browser console";
      } finally {
        exportButton.disabled = false;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function render() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
