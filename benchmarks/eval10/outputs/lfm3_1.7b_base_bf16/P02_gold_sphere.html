<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brushed Gold Sphere on Stone Pedestal</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #glb-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    #glb-button:hover { background: #222; }
  </style>
</head>
<body>

<div id="glb-button">Export GLB</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'; // not needed for manual export but used for loading pre-made assets

// ---------- Scene Setup ----------
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    window.renderer = renderer;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
scene.background = new THREE.Color(0x000000); // black background for pedestal

// Light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    window.camera = camera;
camera.position.set(0, 2, 6);

// Controls (optional)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// ---------- Ground Pedestal ----------
// Dark circular stone pedestal
function createPedestal() {
  const geometry = new THREE.CircleGeometry(1.5, 64);
  // Stone texture: dark gray with some roughness
  const stoneMaterial = new THREE.MeshStandardMaterial({
    color: 0x2b2b2b,
    roughness: 0.9,
    metalness: 0.2,
    envMapIntensity: 0.5
  });
  const pedestal = new THREE.Mesh(geometry, stoneMaterial);
  pedestal.rotation.x = -Math.PI / 2; // start flat on XY plane but we'll place at Z=0
  pedestal.position.set(0, 0.1, 0); // slightly above ground
  scene.add(pedestal);
  return pedestal;
}
const pedestal = createPedestal();

// ---------- Brushed Gold Sphere ----------
function createSphere() {
  // Use a low-poly brushed-gold look: a sphere with a slight metallic sheen and roughness
  const geometry = new THREE.SphereGeometry(1.2, 32, 32);
  const material = new THREE.MeshStandardMaterial({
    color: 0xffd700, // gold
    roughness: 0.4,
    metalness: 0.7,
    specularity: 0.8,
    transparent: true,
    opacity: 1.0,
    depthWrite: false
  });
  const sphere = new THREE.Mesh(geometry, material);
  // Position sphere on top of pedestal
  sphere.position.set(0, 0.5, 0); // above pedestal center
  scene.add(sphere);
  return sphere;
}
const sphere = createSphere();

// Light to highlight gold
const heroLight = new THREE.DirectionalLight(0xffffff, 1.2);
heroLight.position.set(2, 4, 2);
scene.add(heroLight);

// ---------- Animation? Not needed – static scene ----------
// If we wanted animation we could add a simple spin on sphere or pedestal, but not required.

// ---------- Render Loop ----------
renderer.setAnimationFrame(function animate() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
});
</script>

</html>
