<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snow-Capped Pine</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b9d2d6;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 24px;
      left: 26px;
      z-index: 2;
      max-width: min(360px, calc(100vw - 52px));
      padding: 16px 18px;
      color: #f4f7ef;
      background: rgba(20, 31, 29, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(13, 24, 23, 0.2);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .hud h1 {
      margin: 0 0 5px;
      font-size: clamp(19px, 3vw, 27px);
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .hud p {
      margin: 0;
      color: rgba(244, 247, 239, 0.72);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 2;
      padding: 8px 11px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(20, 31, 29, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .hud {
        top: 14px;
        left: 14px;
        padding: 12px 14px;
      }

      .badge {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>Snow-Capped Pine</h1>
    <p>Drag to orbit · Scroll or pinch to zoom<br />The scene is fully procedural.</p>
  </div>
  <div class="badge">Three.js · Low-poly study</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.fog = new THREE.Fog(0xb9d2d6, 15, 38);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------
    scene.add(new THREE.HemisphereLight(0xd9eef2, 0x536044, 2.1));

    const sun = new THREE.DirectionalLight(0xfff1cf, 3.2);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 13;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x9fc8dc, 1.25);
    rim.position.set(7, 7, -8);
    scene.add(rim);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------
    const barkMaterial = new THREE.MeshStandardMaterial({
      color: 0x604632,
      roughness: 0.96,
      metalness: 0,
      flatShading: true
    });

    const rootMaterial = new THREE.MeshStandardMaterial({
      color: 0x58412f,
      roughness: 1,
      flatShading: true
    });

    const foliageMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0x244f3c,
        roughness: 0.94,
        flatShading: true
      }),
      new THREE.MeshStandardMaterial({
        color: 0x2d6347,
        roughness: 0.95,
        flatShading: true
      }),
      new THREE.MeshStandardMaterial({
        color: 0x386b4c,
        roughness: 0.95,
        flatShading: true
      }),
      new THREE.MeshStandardMaterial({
        color: 0x417650,
        roughness: 0.95,
        flatShading: true
      })
    ];

    const snowMaterial = new THREE.MeshStandardMaterial({
      color: 0xf3f7ef,
      roughness: 0.92,
      flatShading: true
    });

    const rockMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d746a,
      roughness: 1,
      flatShading: true
    });

    const darkRockMaterial = new THREE.MeshStandardMaterial({
      color: 0x555d55,
      roughness: 1,
      flatShading: true
    });

    const mossMaterial = new THREE.MeshStandardMaterial({
      color: 0x647b3c,
      roughness: 1,
      flatShading: true
    });

    const mossLightMaterial = new THREE.MeshStandardMaterial({
      color: 0x82944c,
      roughness: 1,
      flatShading: true
    });

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------
    function mesh(geometry, material, position, scale, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(...position);
      if (scale) object.scale.set(...scale);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function makeSnowCapGeometry(radius, height, radialSegments = 8) {
      const geometry = new THREE.ConeGeometry(
        radius,
        height,
        radialSegments,
        1,
        true
      );

      const position = geometry.attributes.position;
      const colors = [];

      for (let i = 0; i < position.count; i++) {
        const y = position.getY(i);
        const t = THREE.MathUtils.clamp((y + height * 0.5) / height, 0, 1);
        const color = new THREE.Color().lerpColors(
          new THREE.Color(0x27563f),
          new THREE.Color(0xf4f7ed),
          t
        );
        colors.push(color.r, color.g, color.b);
      }

      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    function addFoliageLayer({
      radius,
      height,
      y,
      materialIndex = 0,
      rotation = 0
    }) {
      const group = new THREE.Group();
      group.position.y = y;
      group.rotation.y = rotation;
      scene.add(group);

      // A single snow-colored upper section gives each cone a soft, dusty cap.
      const capHeight = height * 0.29;
      const cap = mesh(
        makeSnowCapGeometry(radius * 0.94, capHeight, 8),
        snowMaterial,
        [0, capHeight * 0.5, 0],
        [1, 1, 1],
        group
      );

      const body = mesh(
        new THREE.ConeGeometry(radius, height - capHeight, 8, 1),
        foliageMaterials[materialIndex],
        [0, -(height - capHeight) * 0.5, 0],
        [1, 1, 1],
        group
      );

      // Low-profile edge definition emphasizes the low-poly construction.
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(body.geometry, 20),
        new THREE.LineBasicMaterial({
          color: 0x8ba57a,
          transparent: true,
          opacity: 0.22
        })
      );
      edges.position.copy(body.position);
      edges.scale.copy(body.scale);
      group.add(edges);

      return group;
    }

    function createBarkTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 512;
      const context = canvas.getContext("2d");

      context.fillStyle = "#604632";
      context.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 110; i++) {
        const x = Math.random() * canvas.width;
        const width = 1 + Math.random() * 5;
        const shade = 35 + Math.floor(Math.random() * 45);

        context.strokeStyle = `rgb(${shade + 50}, ${shade}, ${shade - 22})`;
        context.lineWidth = width;
        context.beginPath();
        context.moveTo(x, 0);

        let currentX = x;
        for (let y = 0; y <= canvas.height; y += 32) {
          currentX += (Math.random() - 0.5) * 8;
          context.lineTo(currentX, y);
        }

        context.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 5);
      return texture;
    }

    // -------------------------------------------------------------------------
    // Tapered, slightly curved bark trunk
    // -------------------------------------------------------------------------
    function createTaperedTrunk(height, topRadius, bottomRadius, segments = 10) {
      const radialSegments = 9;
      const positions = [];
      const normals = [];
      const indices = [];

      for (let row = 0; row <= 8; row++) {
        const t = row / 8;
        const y = -height * 0.5 + t * height;
        const radius = THREE.MathUtils.lerp(topRadius, bottomRadius, t);
        const bend = Math.sin(t * Math.PI) * 0.18;

        for (let segment = 0; segment <= radialSegments; segment++) {
          const angle = (segment / radialSegments) * Math.PI * 2;
          const x = Math.cos(angle) * radius + Math.sin(angle * 2) * 0.035;
          const z = Math.sin(angle) * radius;
          positions.push(x, y, z);

          const normal = new THREE.Vector3(
            Math.cos(angle),
            0.08,
            Math.sin(angle)
          ).normalize();
          normals.push(normal.x, normal.y, normal.z);
        }
      }

      for (let row = 0; row < 8; row++) {
        for (let segment = 0; segment < radialSegments; segment++) {
          const a = row * (radialSegments + 1) + segment;
          const b = a + radialSegments + 1;
          const c = b + 1;
          const d = a + 1;

          indices.push(a, b, d, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geometry.setIndex(indices);
      geometry.computeBoundingSphere();
      return geometry;
    }

    const trunk = mesh(
      createTaperedTrunk(7.6, 0.28, 0.68, 1),
      barkMaterial,
      [0, 3.8, 0]
    );

    // Vertical bark ridges and knots add character without external textures.
    for (let i = 0; i < 13; i++) {
      const angle = (i / 13) * Math.PI * 2 + 0.15;
      const radius = 0.52 + (i % 4) * 0.055;
      const height = 0.7 + ((i * 0.67) % 1.4);

      const ridge = mesh(
        new THREE.CylinderGeometry(0.025, 0.038, height, 4),
        barkMaterial,
        [
          Math.cos(angle) * radius,
          0.75 + (i % 3) * 0.48,
          Math.sin(angle) * radius
        ],
        [1, 1, 1]
      );
      ridge.rotation.y = -angle;
    }

    // -------------------------------------------------------------------------
    // Exposed roots spreading across the mossy rock
    // -------------------------------------------------------------------------
    function createRoot(points, radius = 0.14) {
      const curve = new THREE.CatmullRomCurve3(
        points.map((point) => new THREE.Vector3(...point))
      );

      const geometry = new THREE.TubeGeometry(curve, 20, radius, 6, false);
      return mesh(geometry, rootMaterial, [0, 0, 0]);
    }

    const rootConfigurations = [
      {
        points: [
          [0.12, 0.38, 0.05],
          [0.45, 0.27, 0.22],
          [0.95, 0.16, 0.48],
          [1.35, 0.13, 0.65]
        ],
        radius: 0.16
      },
      {
        points: [
          [-0.12, 0.36, 0.1],
          [-0.48, 0.25, 0.25],
          [-0.92, 0.16, 0.3],
          [-1.25, 0.12, 0.48]
        ],
        radius: 0.15
      },
      {
        points: [
          [0.08, 0.34, -0.13],
          [0.32, 0.24, -0.42],
          [0.72, 0.16, -0.72],
          [1.05, 0.13, -0.88]
        ],
        radius: 0.13
      },
      {
        points: [
          [-0.05, 0.34, -0.08],
          [-0.36, 0.23, -0.38],
          [-0.72, 0.16, -0.55],
          [-1.0, 0.13, -0.7]
        ],
        radius: 0.13
      },
      {
        points: [
          [0.1, 0.36, 0.2],
          [0.25, 0.28, 0.78],
          [0.42, 0.2, 1.12],
          [0.5, 0.16, 1.4]
        ],
        radius: 0.11
      },
      {
        points: [
          [-0.1, 0.35, 0.18],
          [-0.28, 0.27, 0.72],
          [-0.48, 0.2, 1.0],
          [-0.56, 0.17, 1.25]
        ],
        radius: 0.1
      }
    ];

    rootConfigurations.forEach((root) => createRoot(root.points, root.radius));

    // Smaller exposed rootlets.
    const rootlets = [
      [[0.4, 0.3, 0.15], [0.52, 0.25, 0.42], [0.68, 0.22, 0.65]],
      [[-0.38, 0.3, 0.12], [-0.5, 0.25, 0.4], [-0.67, 0.22, 0.62]],
      [[0.05, 0.3, -0.2], [0.2, 0.25, -0.48], [0.36, 0.22, -0.72]],
      [[-0.08, 0.3, -0.18], [-0.23, 0.25, -0.47], [-0.4, 0.22, -0.7]]
    ];

    rootlets.forEach((points) => createRoot(points, 0.055));

    // -------------------------------------------------------------------------
    // Four stacked, snow-dusted foliage cones
    // -------------------------------------------------------------------------
    addFoliageLayer({
      radius: 3.05,
      height: 2.7,
      y: 1.45,
      materialIndex: 0,
      rotation: 0.2
    });

    addFoliageLayer({
      radius: 2.55,
      height: 2.35,
      y: 3.02,
      materialIndex: 1,
      rotation: 0.72
    });

    addFoliageLayer({
      radius: 2.08,
      height: 2.0,
      y: 4.52,
      materialIndex: 2,
      rotation: 1.35
    });

    addFoliageLayer({
      radius: 1.65,
      height: 1.72,
      y: 5.92,
      materialIndex: 3,
      rotation: 1.9
    });

    // A few isolated snow flakes around the upper branches.
    const snowFlakeGeometry = new THREE.ConeGeometry(0.065, 0.18, 3);
    const snowFlakeMaterial = new THREE.MeshBasicMaterial({
      color: 0xf5f7ef,
      transparent: true,
      opacity: 0.85
    });

    for (let i = 0; i < 34; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 1.4 + Math.random() * 2.2;
      const flake = mesh(
        snowFlakeGeometry,
        snowFlakeMaterial,
        [
          Math.cos(angle) * radius,
          6.1 + Math.random() * 1.25,
          Math.sin(angle) * radius
        ],
        [1, 1 + Math.random(), 1],
        scene
      );
      flake.rotation.set(
        Math.random() * 0.4,
        angle,
        (Math.random() - 0.5) * 0.35
      );
    }

    // -------------------------------------------------------------------------
    // Mossy rock patch
    // -------------------------------------------------------------------------
    const rockGroup = new THREE.Group();
    scene.add(rockGroup);

    function addRock(position, scale, material = rockMaterial) {
      return mesh(
        new THREE.DodecahedronGeometry(1, 0),
        material,
        position,
        scale,
        rockGroup
      );
    }

    addRock([0, -0.65, 0], [2.9, 1.35, 2.45]);
    addRock([-1.25, -0.8, 0.15], [1.25, 0.75, 1.05], darkRockMaterial);
    addRock([1.15, -0.78, -0.35], [1.05, 0.65, 0.9], darkRockMaterial);
    addRock([0.25, -0.83, 1.05], [1.15, 0.6, 0.85], rockMaterial);
    addRock([-0.45, -0.79, -1.05], [0.95, 0.55, 0.8], darkRockMaterial);

    // Irregular moss patches on the rock surface.
    const mossPatchGeometry = new THREE.CircleGeometry(0.25, 7);
    const mossPatchMaterial = new THREE.MeshStandardMaterial({
      color: 0x657b3b,
      roughness: 1,
      side: THREE.DoubleSide,
      flatShading: true
    });

    const mossPositions = [
      [-1.45, -0.48, 0.55, 0.34],
      [-0.95, -0.5, 0.2, 0.28],
      [0.8, -0.48, 0.65, 0.4],
      [1.35, -0.52, 0.25, 0.25],
      [-0.25, -0.5, -0.72, 0.32],
      [0.55, -0.5, -0.85, 0.27],
      [1.65, -0.5, -0.5, 0.22],
      [-1.75, -0.5, -0.45, 0.2]
    ];

    mossPositions.forEach(([x, y, z, size]) => {
      const patch = mesh(
        mossPatchGeometry,
        mossMaterial,
        [x, y, z],
        [size, size * 0.35, size],
        rockGroup
      );
      patch.rotation.y = Math.random() * Math.PI;
      patch.rotation.z = (Math.random() - 0.5) * 0.25;
    });

    // Small tufts of moss.
    const mossTuftGeometry = new THREE.ConeGeometry(0.13, 0.34, 5);
    const tuftMaterial = new THREE.MeshStandardMaterial({
      color: 0x789043,
      roughness: 1,
      flatShading: true
    });

    for (let i = 0; i < 22; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.7 + Math.random() * 1.85;
      const tuft = mesh(
        mossTuftGeometry,
        tuftMaterial,
        [
          Math.cos(angle) * radius,
          -0.4 + Math.random() * 0.12,
          Math.sin(angle) * radius
        ],
        [1, 0.7 + Math.random() * 0.8, 1],
        rockGroup
      );
      tuft.rotation.y = Math.random() * Math.PI;
    }

    // -------------------------------------------------------------------------
    // Ground and distant snowy landscape
    // -------------------------------------------------------------------------
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xaebfba,
      roughness: 1,
      flatShading: true
    });

    const ground = mesh(
      new THREE.PlaneGeometry(70, 70),
      groundMaterial,
      [0, -1.35, 0],
      [1, 1, 1]
    );
    ground.rotation.x = -Math.PI / 2;
    ground.castShadow = false;

    // Distant low-poly snowdrifts.
    const driftMaterial = new THREE.MeshStandardMaterial({
      color: 0xd5e0d8,
      roughness: 1,
      flatShading: true
    });

    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.2;
      const radius = 14 + Math.random() * 12;
      const drift = mesh(
        new THREE.ConeGeometry(2.5 + Math.random() * 3.2, 1.1 + Math.random() * 1.6, 7),
        driftMaterial,
        [
          Math.cos(angle) * radius,
          -1.25 + (1.1 + Math.random() * 1.6) * 0.48,
          Math.sin(angle) * radius
        ],
        [1, 1, 1]
      );
      drift.castShadow = false;
    }

    // -------------------------------------------------------------------------
    // Direct camera controls: orbit, wheel zoom, and pinch zoom
    // -------------------------------------------------------------------------
    const target = new THREE.Vector3(0, 2.8, 0);
    const spherical = new THREE.Spherical(11.8, Math.PI * 0.39, Math.PI * 0.23);
    const initialSpherical = spherical.clone();

    let dragging = false;
    let previousX = 0;
    let previousY = 0;
    const activePointers = new Map();
    let pinchDistance = 0;

    function updateCamera() {
      spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.25, Math.PI * 0.49);
      spherical.radius = THREE.MathUtils.clamp(spherical.radius, 6.2, 24);
      camera.position.setFromSpherical(spherical).add(target);
      camera.lookAt(target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        dragging = true;
        previousX = event.clientX;
        previousY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      } else if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        pinchDistance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        const distance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );

        if (pinchDistance > 0) {
          spherical.radius *= pinchDistance / Math.max(distance, 1);
          updateCamera();
        }

        pinchDistance = distance;
        return;
      }

      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      spherical.theta -= deltaX * 0.006;
      spherical.phi -= deltaY * 0.005;

      previousX = event.clientX;
      previousY = event.clientY;
      updateCamera();
    });

    function endPointer(event) {
      activePointers.delete(event.pointerId);

      if (activePointers.size === 0) {
        dragging = false;
        pinchDistance = 0;
      }
    }

    renderer.domElement.addEventListener("pointerup", endPointer);
    renderer.domElement.addEventListener("pointercancel", endPointer);
    renderer.domElement.addEventListener("lostpointercapture", endPointer);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        spherical.radius *= Math.exp(event.deltaY * 0.001);
        updateCamera();
      },
      { passive: false }
    );

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    updateCamera();

    // Subtle ambient motion and drifting snow.
    const clock = new THREE.Clock();
    const fallingSnow = [];

    for (let i = 0; i < 45; i++) {
      const flake = new THREE.Mesh(
        new THREE.ConeGeometry(0.035, 0.12, 2),
        snowFlakeMaterial
      );
      flake.position.set(
        (Math.random() - 0.5) * 22,
        Math.random() * 14,
        (Math.random() - 0.5) * 18
      );
      flake.userData.speed = 0.16 + Math.random() * 0.16;
      flake.userData.phase = Math.random() * Math.PI * 2;
      scene.add(flake);
      fallingSnow.push(flake);
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      fallingSnow.forEach((flake, index) => {
        flake.position.y -= flake.userData.speed * 0.016;
        flake.position.x += Math.sin(elapsed * 0.45 + flake.userData.phase) * 0.0008;

        if (flake.position.y < -2) {
          flake.position.y = 13 + Math.random() * 3;
          flake.position.x = (Math.random() - 0.5) * 22;
          flake.position.z = (Math.random() - 0.5) * 18;
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
