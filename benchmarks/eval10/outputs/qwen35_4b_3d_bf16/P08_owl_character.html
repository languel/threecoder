<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perched Barn Owl</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071019;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .title {
      position: fixed;
      top: 28px;
      left: 30px;
      z-index: 10;
      pointer-events: none;
      color: #f4e5b6;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .title p {
      margin: 7px 0 0;
      color: rgba(226, 214, 178, 0.7);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hint {
      position: fixed;
      right: 24px;
      bottom: 22px;
      z-index: 10;
      padding: 9px 13px;
      border: 1px solid rgba(239, 220, 171, 0.16);
      border-radius: 999px;
      color: rgba(239, 220, 171, 0.68);
      background: rgba(7, 16, 24, 0.52);
      backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .title {
        top: 20px;
        left: 20px;
      }

      .hint {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>The Quiet Watcher</h1>
    <p>A little barn owl on the branch</p>
  </div>
  <div class="hint">Drag to look · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------
    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x071019);
    scene.fog = new THREE.FogExp2(0x08131d, 0.055);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    window.renderer = renderer;
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------
    const materials = {
      bark: new THREE.MeshStandardMaterial({
        color: 0x38271c,
        roughness: 0.96,
        flatShading: true
      }),
      barkLight: new THREE.MeshStandardMaterial({
        color: 0x5b3d29,
        roughness: 0.94,
        flatShading: true
      }),
      barkDark: new THREE.MeshStandardMaterial({
        color: 0x211813,
        roughness: 1,
        flatShading: true
      }),
      owlBody: new THREE.MeshStandardMaterial({
        color: 0x26333b,
        roughness: 0.92,
        flatShading: true
      }),
      owlWing: new THREE.MeshStandardMaterial({
        color: 0x17232a,
        roughness: 1,
        flatShading: true
      }),
      feather: new THREE.MeshStandardMaterial({
        color: 0x4d5d61,
        roughness: 0.95,
        flatShading: true
      }),
      featherLight: new THREE.MeshStandardMaterial({
        color: 0x718082,
        roughness: 0.95,
        flatShading: true
      }),
      cream: new THREE.MeshStandardMaterial({
        color: 0xf0dfb3,
        roughness: 0.78,
        flatShading: true
      }),
      eye: new THREE.MeshStandardMaterial({
        color: 0xffd979,
        emissive: 0xb87620,
        emissiveIntensity: 1.2,
        roughness: 0.3
      }),
      pupil: new THREE.MeshStandardMaterial({
        color: 0x050607,
        roughness: 0.25
      }),
      beak: new THREE.MeshStandardMaterial({
        color: 0xd9b968,
        roughness: 0.55,
        flatShading: true
      }),
      feet: new THREE.MeshStandardMaterial({
        color: 0x4b3025,
        roughness: 0.9
      }),
      moss: new THREE.MeshStandardMaterial({
        color: 0x314a35,
        roughness: 1,
        flatShading: true
      }),
      lichen: new THREE.MeshStandardMaterial({
        color: 0x718064,
        roughness: 1,
        flatShading: true
      })
    };

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------
    function mesh(geometry, material, position, rotation = null, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(...position);
      if (rotation) object.rotation.set(...rotation);
      parent.add(object);
      return object;
    }

    function lowSphere(radius, material, position, rotation = null, parent = scene, widthSegments = 12) {
      return mesh(
        new THREE.SphereGeometry(radius, widthSegments, Math.max(6, widthSegments / 2)),
        material,
        position,
        rotation,
        parent
      );
    }

    function makeFeather(parent, x, y, z, sx, sy, material, rotation = null) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0.5 * sy);
      shape.bezierCurveTo(-sx * 0.45, -0.15 * sy, -sx, -0.35 * sy, 0, -0.5 * sy);
      shape.bezierCurveTo(sx * 0.45, -0.15 * sy, sx, -0.35 * sy, 0, 0.5 * sy);

      const geometry = new THREE.ShapeGeometry(shape, 2);
      geometry.computeVertexNormals();
      return mesh(geometry, material, [x, y, z], rotation, parent);
    }

    function makeEarTuft(parent, x, y, z, material) {
      const tuft = mesh(
        new THREE.ConeGeometry(0.13, 0.72, 4),
        material,
        [x, y, z],
        [0, 0, -0.22]
      );
      tuft.rotation.z = x > 0 ? -0.16 : 0.16;
      return tuft;
    }

    // -------------------------------------------------------------------------
    // Environment: moonlit forest
    // -------------------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0x8bb5c4, 0x17100d, 1.2);
    scene.add(hemi);

    const moonLight = new THREE.DirectionalLight(0xd9eaff, 2.3);
    moonLight.position.set(-7, 12, 8);
    scene.add(moonLight);

    const warmFill = new THREE.PointLight(0xffb55f, 24, 18, 2);
    warmFill.position.set(4, 1.5, 3);
    scene.add(warmFill);

    // Sky dome with a soft procedural gradient.
    const skyGeometry = new THREE.SphereGeometry(45, 32, 18);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x07131f) },
        horizonColor: { value: new THREE.Color(0x29404a) },
        bottomColor: { value: new THREE.Color(0x091016) }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 horizonColor;
        uniform vec3 bottomColor;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition).y;
          vec3 color = h > 0.0
            ? mix(horizonColor, topColor, pow(max(h, 0.0), 0.55))
            : mix(horizonColor, bottomColor, pow(max(-h, 0.0), 0.7));
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeometry, skyMaterial));

    // Distant trees.
    const treeMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x0c1820, roughness: 1, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x15252d, roughness: 1, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x1b292b, roughness: 1, flatShading: true })
    ];

    function createTree(x, z, scale, variant) {
      const tree = new THREE.Group();
      tree.position.set(x, -1.4, z);
      tree.scale.setScalar(scale);
      scene.add(tree);

      for (let i = 0; i < 3; i++) {
        const trunk = mesh(
          new THREE.CylinderGeometry(0.18 + i * 0.045, 0.28 + i * 0.045, 2.6 - i * 0.2, 7),
          treeMaterials[variant % treeMaterials.length],
          [0, 1.35 + i * 0.2, 0],
          null,
          tree
        );
        trunk.rotation.z = (i - 1) * 0.04;
      }

      const crown = mesh(
        new THREE.ConeGeometry(1.55, 3.2, 7),
        treeMaterials[(variant + 1) % treeMaterials.length],
        [0, 3.2, 0],
        null,
        tree
      );
      crown.rotation.y = variant * 0.4;

      const lowerCrown = mesh(
        new THREE.ConeGeometry(1.25, 2.6, 7),
        treeMaterials[variant % treeMaterials.length],
        [0, 2.45, 0],
        null,
        tree
      );
      lowerCrown.rotation.y = variant * 0.8;
    }

    createTree(-11, -9, 3.3, 0);
    createTree(-7.5, -13, 4.1, 1);
    createTree(2, -15, 4.6, 2);
    createTree(8, -12, 3.8, 0);
    createTree(12, -8, 4.3, 1);
    createTree(-14, -5, 3.0, 2);
    createTree(15, 0, 2.8, 0);

    // Ground and moss.
    const ground = mesh(
      new THREE.CircleGeometry(28, 64),
      new THREE.MeshStandardMaterial({ color: 0x101715, roughness: 1 }),
      [0, -1.65, 0],
      [-Math.PI / 2, 0, 0]
    );

    for (let i = 0; i < 45; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 2 + Math.random() * 12;
      const clump = mesh(
        new THREE.IcosahedronGeometry(0.18 + Math.random() * 0.28, 0),
        i % 3 === 0 ? materials.moss : materials.lichen,
        [Math.cos(angle) * radius, -1.48, Math.sin(angle) * radius]
      );
      clump.scale.set(1.5, 0.5, 1);
      clump.rotation.y = Math.random() * Math.PI;
    }

    // -------------------------------------------------------------------------
    // Gnarled branch
    // -------------------------------------------------------------------------
    const branchGroup = new THREE.Group();
    scene.add(branchGroup);

    const mainCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-4.2, -0.75, 0.15),
      new THREE.Vector3(-2.7, -0.55, 0.1),
      new THREE.Vector3(-0.9, -0.6, -0.05),
      new THREE.Vector3(1.0, -0.48, 0.15),
      new THREE.Vector3(2.8, -0.55, -0.05),
      new THREE.Vector3(4.7, -0.35, 0.2)
    ]);

    const mainBranch = mesh(
      new THREE.TubeGeometry(mainCurve, 72, 0.28, 9, false),
      materials.bark,
      null,
      null,
      branchGroup
    );

    // Thick fork on the left.
    const forkA = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-1.7, -0.48, 0.08),
      new THREE.Vector3(-2.35, 0.18, 0.2),
      new THREE.Vector3(-2.75, 0.68, 0.24),
      new THREE.Vector3(-3.0, 1.08, 0.2)
    ]);

    const forkB = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2.1, -0.15, 0.15),
      new THREE.Vector3(-2.45, 0.35, 0.38),
      new THREE.Vector3(-2.8, 0.88, 0.48),
      new THREE.Vector3(-3.15, 1.18, 0.5)
    ]);

    mesh(new THREE.TubeGeometry(forkA, 36, 0.19, 8, false), materials.barkLight, null, null, branchGroup);
    mesh(new THREE.TubeGeometry(forkB, 36, 0.15, 8, false), materials.barkDark, null, null, branchGroup);

    // Small broken branch.
    const twigCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(2.0, -0.5, 0.02),
      new THREE.Vector3(2.65, -0.18, 0.18),
      new THREE.Vector3(3.0, 0.12, 0.3),
      new THREE.Vector3(3.35, 0.34, 0.38)
    ]);
    mesh(new THREE.TubeGeometry(twigCurve, 30, 0.11, 7, false), materials.barkDark, null, null, branchGroup);

    // Roots wrapping around the main limb.
    for (let i = 0; i < 5; i++) {
      const root = mesh(
        new THREE.TorusGeometry(0.38 + i * 0.025, 0.075, 6, 24),
        i % 2 ? materials.barkDark : materials.barkLight,
        [0, -0.83 + i * 0.025, 0.1],
        [Math.PI / 2, 0, 0]
      );
      root.scale.set(1.25, 0.7, 1);
      root.rotation.z = (i - 2) * 0.08;
    }

    // Moss and lichen on the branch.
    for (let i = 0; i < 28; i++) {
      const t = Math.random();
      const x = THREE.MathUtils.lerp(-4.1, 4.6, t);
      const y = -0.72 + Math.sin(t * Math.PI) * 0.16;
      const z = 0.12 + Math.cos(t * Math.PI) * 0.13;

      const patch = mesh(
        new THREE.IcosahedronGeometry(0.12 + Math.random() * 0.18, 0),
        i % 4 === 0 ? materials.moss : materials.lichen,
        [x, y, z]
      );
      patch.scale.set(1.5, 0.55, 0.8);
      patch.rotation.y = Math.random() * Math.PI;
    }

    // -------------------------------------------------------------------------
    // Owl
    // -------------------------------------------------------------------------
    const owl = new THREE.Group();
    owl.position.set(-0.15, 0.12, 0.05);
    owl.rotation.y = -0.08;
    scene.add(owl);

    const body = lowSphere(0.78, materials.owlBody, [0, 1.48, 0], [0, 0, 0], owl, 16);
    body.scale.set(1, 1.12, 0.9);

    const belly = lowSphere(0.56, materials.cream, [0, 1.37, 0.48], [0, 0, 0], owl, 14);
    belly.scale.set(0.9, 0.95, 0.48);

    const chest = lowSphere(0.46, materials.owlWing, [0, 1.46, 0.35], [0, 0, 0], owl, 12);
    chest.scale.set(0.88, 0.9, 0.35);

    // Neck and head pivot.
    const neck = lowSphere(0.58, materials.owlBody, [0, 2.02, 0], [0, 0, 0], owl, 14);
    neck.scale.set(1, 0.9, 0.9);

    const head = new THREE.Group();
    head.position.set(0, 2.34, 0);
    owl.add(head);

    const skull = lowSphere(0.66, materials.owlBody, [0, 0, 0], [0, 0, 0], head, 16);
    skull.scale.set(1, 1.06, 0.92);

    // Heart-shaped facial disk.
    const faceShape = new THREE.Shape();
    faceShape.moveTo(0, 0.53);
    faceShape.bezierCurveTo(-0.22, 0.47, -0.43, 0.28, -0.46, 0.02);
    faceShape.bezierCurveTo(-0.49, -0.19, -0.34, -0.39, -0.12, -0.43);
    faceShape.bezierCurveTo(0, -0.48, 0.12, -0.43, 0.12, -0.43);
    faceShape.bezierCurveTo(0.34, -0.39, 0.49, -0.19, 0.46, 0.02);
    faceShape.bezierCurveTo(0.43, 0.28, 0.22, 0.47, 0, 0.53);

    const face = mesh(
      new THREE.ShapeGeometry(faceShape, 12),
      materials.cream,
      [0, 0.06, 0.48],
      null,
      head
    );
    face.material.side = THREE.DoubleSide;

    // Facial feather ridges.
    for (let i = -3; i <= 3; i++) {
      const ridge = mesh(
        new THREE.TorusGeometry(0.34 + Math.abs(i) * 0.025, 0.018, 4, 20),
        materials.owlWing,
        [i * 0.09, 0.03, 0.535],
        [0, 0, 0],
        head
      );
      ridge.scale.y = 0.78;
    }

    // Eyes and pupils.
    for (const side of [-1, 1]) {
      lowSphere(
        0.205,
        materials.owlWing,
        [side * 0.34, 0.12, 0.55],
        null,
        head,
        12
      );

      lowSphere(
        0.105,
        materials.pupil,
        [side * 0.34, 0.12, 0.68],
        null,
        head,
        12
      );

      const glint = mesh(
        new THREE.SphereGeometry(0.025, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xffffff }),
        [side * 0.34 - 0.025, 0.145, 0.718],
        null,
        head
      );
    }

    // Beak.
    const beak = mesh(
      new THREE.ConeGeometry(0.105, 0.34, 7),
      materials.beak,
      [0, -0.06, 0.68],
      [Math.PI / 2, 0, 0],
      head
    );
    beak.scale.z = 0.65;

    // Facial feather filaments.
    for (let i = -4; i <= 4; i++) {
      const side = Math.sign(i || 1);
      const filament = mesh(
        new THREE.ConeGeometry(0.018, 0.28 + Math.abs(i) * 0.015, 4),
        materials.owlWing,
        [i * 0.075, -0.03, 0.61],
        [0, side * 0.25, 0],
        head
      );
      filament.rotation.x = side * 0.3;
    }

    // Ear tufts.
    makeEarTuft(head, -0.23, 0.37, 0, materials.owlWing);
    makeEarTuft(head, 0.23, 0.37, 0, materials.owlWing);

    // Wing assemblies for gentle idle bobbing.
    const leftWing = new THREE.Group();
    const rightWing = new THREE.Group();
    leftWing.position.set(-0.48, 1.67, 0);
    rightWing.position.set(0.48, 1.67, 0);
    owl.add(leftWing, rightWing);

    for (const wing of [leftWing, rightWing]) {
      const shoulder = lowSphere(0.29, materials.owlWing, [0, 0, 0], null, wing, 12);
      shoulder.scale.set(0.8, 1.15, 0.7);

      makeFeather(wing, -0.16, -0.12, 0.02, 0.48, 0.72, materials.owlWing, [0, 0.18, 0]);
      makeFeather(wing, 0.16, -0.12, 0.02, 0.48, 0.72, materials.owlWing, [0, -0.18, 0]);
      makeFeather(wing, -0.35, 0.08, 0.02, 0.36, 0.48, materials.feather, [0, 0.25, 0]);
      makeFeather(wing, 0.35, 0.08, 0.02, 0.36, 0.48, materials.feather, [0, -0.25, 0]);

      for (let i = 0; i < 4; i++) {
        const feather = makeFeather(
          wing,
          i % 2 ? -0.32 : 0.32,
          -0.15 + i * 0.09,
          0.02,
          0.23,
          0.28,
          i % 2 ? materials.feather : materials.featherLight,
          [0, i % 2 ? -0.3 : 0.3, 0]
        );
        feather.rotation.z = i % 2 ? 0.2 : -0.2;
      }
    }

    // Perched arms.
    for (const side of [-1, 1]) {
      const arm = lowSphere(0.12, materials.featherLight, [side * 0.52, 1.08, 0.04], null, owl, 10);
      arm.scale.set(0.8, 1.25, 0.7);

      const claw = mesh(
        new THREE.ConeGeometry(0.055, 0.28, 6),
        materials.feet,
        [side * 0.52, 0.74, 0.04],
        [Math.PI / 2, 0, side * 0.12],
        owl
      );
      claw.rotation.z = side * 0.12;
    }

    // Small tail feathers behind the owl.
    const tailLeft = lowSphere(0.18, materials.owlWing, [-0.38, 1.15, -0.42], [0, 0, 0], owl, 10);
    const tailRight = lowSphere(0.18, materials.owlWing, [0.38, 1.15, -0.42], [0, 0, 0], owl, 10);
    tailLeft.scale.set(0.65, 1.4, 0.4);
    tailRight.scale.set(0.65, 1.4, 0.4);

    // -------------------------------------------------------------------------
    // Direct camera controls: no external controls addon
    // -------------------------------------------------------------------------
    const cameraState = {
      yaw: 0.25,
      pitch: 0.22,
      distance: 8.7,
      target: new THREE.Vector3(0, 1.65, 0)
    };

    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;
      previousX = event.clientX;
      previousY = event.clientY;

      cameraState.yaw -= deltaX * 0.006;
      cameraState.pitch = THREE.MathUtils.clamp(
        cameraState.pitch + deltaY * 0.004,
        -0.12,
        0.72
      );
    });

    function stopDragging(event) {
      dragging = false;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", stopDragging);
    renderer.domElement.addEventListener("pointercancel", stopDragging);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        cameraState.distance = THREE.MathUtils.clamp(
          cameraState.distance + event.deltaY * 0.006,
          5.2,
          13
        );
      },
      { passive: false }
    );

    function updateCamera() {
      const horizontal = Math.cos(cameraState.pitch) * cameraState.distance;
      camera.position.set(
        cameraState.target.x + Math.sin(cameraState.yaw) * horizontal,
        cameraState.target.y + Math.sin(cameraState.pitch) * cameraState.distance,
        cameraState.target.z + Math.cos(cameraState.yaw) * horizontal
      );
      camera.lookAt(cameraState.target);
    }

    updateCamera();

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------
    const clock = new THREE.Clock();
    let headTilt = 0;

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const idle = Math.sin(elapsed * 1.25);
      const slowBreath = Math.sin(elapsed * 1.65) * 0.025;

      // Gentle head tilting, with a subtle periodic drift.
      headTilt = Math.sin(elapsed * 0.72) * 0.13 + idle * 0.07;
      head.rotation.z = headTilt;
      head.rotation.x = Math.sin(elapsed * 0.51 + 0.8) * 0.035;

      // Wing-bobbing idle animation.
      const wingBob = Math.sin(elapsed * 1.25) * 0.035;
      leftWing.position.y = wingBob;
      rightWing.position.y = -wingBob;
      leftWing.rotation.z = Math.sin(elapsed * 0.72) * 0.025;
      rightWing.rotation.z = -Math.sin(elapsed * 0.72) * 0.025;

      // Subtle breathing and eye movement.
      const breath = 1 + slowBreath;
      body.scale.y = breath;
      belly.scale.y = 1 / breath;
      skull.scale.set(1, 1.06 * breath, 0.92);

      for (const side of [-1, 1]) {
        const eye = head.children.find((child) =>
          child.type === "SphereGeometry" &&
          child.position.y === 0.12 &&
          child.position.z > 0.6
        );
        if (eye) {
          eye.position.x = side * 0.34 + Math.sin(elapsed * 0.9 + side) * 0.018;
        }
      }

      // Very slow tail feather movement.
      tailLeft.rotation.y = Math.sin(elapsed * 0.55) * 0.08;
      tailRight.rotation.y = -Math.sin(elapsed * 0.55) * 0.08;

      updateCamera();
      renderer.render(scene, camera);
    }

    animate();

    // -------------------------------------------------------------------------
    // Resize handling
    // -------------------------------------------------------------------------
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
