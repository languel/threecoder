<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polly the Fox</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff8eb;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: clamp(18px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      max-width: 360px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #d96b45;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #3d291f;
      font-size: clamp(1.7rem, 5vw, 3.3rem);
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }

    .subtitle {
      margin-top: 12px;
      color: #765c50;
      font-size: clamp(0.85rem, 1.6vw, 1.15rem);
      line-height: 1.5;
    }

    .controls {
      align-self: flex-start;
      padding: 12px 16px;
      border: 1px solid rgba(80, 55, 42, 0.12);
      border-radius: 999px;
      color: #765c50;
      background: rgba(255, 252, 243, 0.68);
      box-shadow: 0 8px 30px rgba(80, 55, 42, 0.08);
      backdrop-filter: blur(12px);
      font-size: 0.78rem;
      font-weight: 650;
    }

    @media (max-width: 600px) {
      .hud {
        padding: 20px;
      }

      .subtitle {
        max-width: 260px;
      }

      .controls {
        align-self: center;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">
      <div class="eyebrow">A little woodland friend</div>
      <h1>Polly the Fox</h1>
      <div class="subtitle">
        A cute low-poly fox with attentive ears, a soft cream chest,
        and a huge white-tipped tail.
      </div>
    </div>
    <div class="controls">Drag to orbit · Scroll or pinch to zoom</div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0xfff8eb);
    scene.fog = new THREE.Fog(0xfff8eb, 9, 18);

    const camera = new THREE.PerspectiveCamera(
      38,
      innerWidth / innerHeight,
      0.1,
      50
    );
    window.camera = camera;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xfffbef, 0x8b6858, 2.3);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff4df, 4.2);
    key.position.set(4, 7, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 18;
    key.shadow.camera.left = -5;
    key.shadow.camera.right = 5;
    key.shadow.camera.top = 5;
    key.shadow.camera.bottom = -5;
    key.shadow.bias = -0.0004;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xffb39c, 1.8);
    rim.position.set(-4, 4, -5);
    scene.add(rim);

    const fill = new THREE.PointLight(0xffffff, 18, 12, 2);
    fill.position.set(2, 2, 4);
    scene.add(fill);

    const materials = {
      fox: new THREE.MeshStandardMaterial({
        color: 0xc94f32,
        roughness: 0.78,
        metalness: 0
      }),
      foxDark: new THREE.MeshStandardMaterial({
        color: 0x8f3023,
        roughness: 0.86
      }),
      cream: new THREE.MeshStandardMaterial({
        color: 0xfff8e9,
        roughness: 0.9
      }),
      muzzle: new THREE.MeshStandardMaterial({
        color: 0xf4d8a6,
        roughness: 0.9
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x241b18,
        roughness: 0.55
      }),
      eye: new THREE.MeshStandardMaterial({
        color: 0x17110f,
        roughness: 0.25
      }),
      ground: new THREE.MeshStandardMaterial({
        color: 0xf4e6cf,
        roughness: 1
      })
    };

    function sphere(radius, material, position, scale = [1, 1, 1], segments = 10) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, segments, Math.max(6, segments - 2)),
        material
      );
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function cone(radius, height, material, position, rotation = [0, 0, 0], segments = 8) {
      const mesh = new THREE.Mesh(
        new THREE.ConeGeometry(radius, height, segments),
        material
      );
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 8) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );

      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function torus(radius, tube, material, position, rotation = [0, 0, 0]) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, 8, 24),
        material
      );
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // Ground and a softly shaped patch beneath the fox.
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5.5, 64),
      materials.ground
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.025;
    ground.receiveShadow = true;
    scene.add(ground);

    const patch = new THREE.Mesh(
      new THREE.CircleGeometry(3.1, 48),
      new THREE.MeshStandardMaterial({
        color: 0xe8d8b8,
        roughness: 1,
        transparent: true,
        opacity: 0.58,
        depthWrite: false
      })
    );
    patch.rotation.x = -Math.PI / 2;
    patch.position.y = 0.002;
    patch.receiveShadow = true;
    scene.add(patch);

    // Seated body.
    const torso = sphere(
      0.9,
      materials.fox,
      [0, 0.87, 0],
      [1.05, 0.82, 0.9],
      14
    );

    const chest = sphere(
      0.63,
      materials.cream,
      [0, 0.93, 0.48],
      [0.72, 0.78, 0.55],
      12
    );

    const belly = sphere(
      0.62,
      materials.cream,
      [0, 0.56, 0.34],
      [0.76, 0.62, 0.48],
      12
    );

    // Head.
    const head = sphere(
      0.7,
      materials.fox,
      [0, 1.62, 0.12],
      [1, 0.95, 0.94],
      14
    );

    // Muzzle and nose.
    sphere(0.48, materials.muzzle, [0, 1.34, 0.57], [0.95, 0.68, 0.66], 12);
    sphere(0.115, materials.black, [0, 1.47, 0.88], [0.75, 0.6, 0.5], 10);

    // Eyes, highlights, and cheeks.
    const eyes = [];
    for (const side of [-1, 1]) {
      sphere(
        0.13,
        materials.eye,
        [side * 0.37, 1.8, 0.48],
        [0.9, 1.05, 0.7],
        10
      );

      sphere(
        0.035,
        materials.cream,
        [side * 0.37 - 0.025, 1.845, 0.66],
        [1, 1, 0.7],
        8
      );

      const cheek = sphere(
        0.16,
        new THREE.MeshStandardMaterial({
          color: 0xf4a279,
          roughness: 0.9
        }),
        [side * 0.43, 1.5, 0.62],
        [0.8, 0.55, 0.35],
        10
      );
      cheek.castShadow = false;
    }

    // Pointed ears.
    const leftEar = cone(
      0.24,
      0.88,
      materials.fox,
      [-0.48, 2.31, 0.05],
      [0.03, -0.12, -0.12]
    );
    const rightEar = cone(
      0.24,
      0.88,
      materials.fox,
      [0.48, 2.31, 0.05],
      [0.03, 0.12, 0.12]
    );

    for (const ear of [leftEar, rightEar]) {
      const inner = cone(
        0.115,
        0.68,
        new THREE.MeshStandardMaterial({
          color: 0xf0c4a8,
          roughness: 0.95
        }),
        ear.position.clone().add(new THREE.Vector3(0, 0.03, 0.15)),
        ear.rotation
      );
      inner.castShadow = false;
    }

    // Attentive arms and paws.
    cylinderBetween([-0.64, 1.25, 0.28], [-0.78, 0.72, 0.43], 0.16, materials.fox);
    cylinderBetween([0.64, 1.25, 0.28], [0.78, 0.72, 0.43], 0.16, materials.fox);

    sphere(0.23, materials.foxDark, [-0.78, 0.48, 0.53], [1.15, 0.72, 0.9], 10);
    sphere(0.23, materials.foxDark, [0.78, 0.48, 0.53], [1.15, 0.72, 0.9], 10);

    // Hind legs and feet.
    cylinderBetween([-0.43, 0.68, -0.2], [-0.68, 0.25, 0.02], 0.25, materials.fox);
    cylinderBetween([0.43, 0.68, -0.2], [0.68, 0.25, 0.02], 0.25, materials.fox);

    sphere(0.27, materials.foxDark, [-0.68, 0.18, 0.02], [1.1, 0.68, 0.8], 10);
    sphere(0.27, materials.foxDark, [0.68, 0.18, 0.02], [1.1, 0.68, 0.8], 10);

    // Small chest tuft: two rounded cream pieces.
    const tuftLeft = sphere(
      0.24,
      materials.cream,
      [-0.18, 1.05, 0.72],
      [0.72, 1.05, 0.62],
      10
    );
    const tuftRight = sphere(
      0.24,
      materials.cream,
      [0.18, 1.05, 0.72],
      [0.72, 1.05, 0.62],
      10
    );

    // A custom tapered, low-poly tube for the large fluffy tail.
    function createTail() {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.48, 0.83, -0.72),
        new THREE.Vector3(-0.92, 0.64, -0.91),
        new THREE.Vector3(-1.45, 0.43, -0.93),
        new THREE.Vector3(-1.82, 0.63, -0.78),
        new THREE.Vector3(-2.02, 1.12, -0.48),
        new THREE.Vector3(-1.96, 1.58, -0.15)
      ]);

      const frames = curve.computeFrenetFrames(48, false);
      const positions = [];
      const colors = [];
      const indices = [];
      const radialSegments = 7;
      const profile = [
        { t: 0.0, r: 0.29 },
        { t: 0.18, r: 0.36 },
        { t: 0.42, r: 0.43 },
        { t: 0.64, r: 0.48 },
        { t: 0.82, r: 0.55 },
        { t: 1.0, r: 0.62 }
      ];

      for (let i = 0; i <= 48; i++) {
        const t = i / 48;
        const point = curve.getPointAt(t);
        const normal = frames.normals[i];
        const binormal = frames.binormals[i];
        const baseRadius = THREE.MathUtils.lerp(
          profile[0].r,
          profile[profile.length - 1].r,
          t
        );

        const whiteBlend = THREE.MathUtils.smoothstep(t, 0.61, 1);
        const color = new THREE.Color().lerpColors(
          new THREE.Color(0xb9472f),
          new THREE.Color(0xfff8e9),
          whiteBlend
        );

        for (let j = 0; j <= radialSegments; j++) {
          const angle = (j / radialSegments) * Math.PI * 2;
          const radius = baseRadius * (1 + Math.sin(angle * 5 + t * 8) * 0.07);
          const offset = normal
            .clone()
            .multiplyScalar(Math.cos(angle) * radius)
            .addScaledVector(binormal, Math.sin(angle) * radius);

          positions.push(
            point.x + offset.x,
            point.y + offset.y,
            point.z + offset.z
          );
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let i = 0; i < 48; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * (radialSegments + 1) + j;
          const b = a + radialSegments + 1;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(colors, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.94,
        flatShading: true
      });

      const tail = new THREE.Mesh(geometry, material);
      tail.castShadow = true;
      tail.receiveShadow = true;
      scene.add(tail);
      return tail;
    }

    const tail = createTail();

    // A few soft forest decorations in the background.
    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x78a96b, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x8fbd78, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x5f9567, roughness: 1 })
    ];

    function leafCluster(x, y, z, scale = 1) {
      const cluster = new THREE.Group();
      cluster.position.set(x, y, z);
      cluster.scale.setScalar(scale);

      for (let i = 0; i < 7; i++) {
        const leaf = new THREE.Mesh(
          new THREE.SphereGeometry(0.28, 8, 6),
          leafMaterials[i % leafMaterials.length]
        );
        leaf.scale.set(0.5, 1.4, 0.3);
        leaf.position.set(
          Math.sin(i * 2.1) * 0.25,
          Math.cos(i * 1.7) * 0.18,
          Math.sin(i * 1.3) * 0.2
        );
        leaf.rotation.z = Math.sin(i * 2.4) * 0.5;
        leaf.castShadow = true;
        cluster.add(leaf);
      }

      scene.add(cluster);
    }

    leafCluster(-2.6, 1.25, -1.4, 1.25);
    leafCluster(2.8, 1.5, -1.7, 1.4);

    // Custom orbit controls, implemented without external addons.
    const controls = {
      target: new THREE.Vector3(-0.1, 1.1, 0),
      azimuth: 0.52,
      polar: 1.28,
      radius: 5.25,
      dragging: false,
      lastX: 0,
      lastY: 0,
      pointers: new Map(),
      pinchDistance: 0
    };

    function updateCamera() {
      const sinPolar = Math.sin(controls.polar);
      camera.position.set(
        controls.target.x + controls.radius * sinPolar * Math.sin(controls.azimuth),
        controls.target.y + controls.radius * Math.cos(controls.polar),
        controls.target.z + controls.radius * sinPolar * Math.cos(controls.azimuth)
      );
      camera.lookAt(controls.target);
    }

    function pointerDistance() {
      const points = [...controls.pointers.values()];
      if (points.length < 2) return 0;
      return Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
      );
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (controls.pointers.size === 1) {
        controls.dragging = true;
        controls.lastX = event.clientX;
        controls.lastY = event.clientY;
      } else if (controls.pointers.size === 2) {
        controls.pinchDistance = pointerDistance();
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.pointers.has(event.pointerId)) return;

      controls.pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (controls.pointers.size === 2) {
        const distance = pointerDistance();
        if (controls.pinchDistance > 0) {
          controls.radius = THREE.MathUtils.clamp(
            controls.radius * (controls.pinchDistance / distance),
            3.2,
            9
          );
        }
        controls.pinchDistance = distance;
        updateCamera();
        return;
      }

      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      controls.azimuth -= dx * 0.006;
      controls.polar = THREE.MathUtils.clamp(
        controls.polar - dy * 0.005,
        0.72,
        1.52
      );

      updateCamera();
    });

    function endPointer(event) {
      controls.pointers.delete(event.pointerId);

      if (controls.pointers.size < 2) {
        controls.pinchDistance = 0;
      }

      if (controls.pointers.size === 0) {
        controls.dragging = false;
      }
    }

    renderer.domElement.addEventListener("pointerup", endPointer);
    renderer.domElement.addEventListener("pointercancel", endPointer);
    renderer.domElement.addEventListener("lostpointercapture", endPointer);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius + event.deltaY * 0.004,
          3.2,
          9
        );
        updateCamera();
      },
      { passive: false }
    );

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    updateCamera();

    const clock = new THREE.Clock();

    function animate() {
      const time = clock.getElapsedTime();

      // Gentle breathing and ear twitch.
      torso.scale.y = 0.82 + Math.sin(time * 1.8) * 0.012;
      chest.scale.y = 0.78 + Math.sin(time * 1.8 + 0.4) * 0.012;
      head.rotation.z = Math.sin(time * 1.1) * 0.012;
      leftEar.rotation.z = -0.12 + Math.sin(time * 1.5) * 0.035;
      rightEar.rotation.z = 0.12 - Math.sin(time * 1.5 + 0.4) * 0.035;

      // Tail remains mostly still but has a subtle living sway.
      tail.rotation.y = Math.sin(time * 0.7) * 0.035;
      tail.rotation.z = Math.sin(time * 0.55 + 1) * 0.018;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
