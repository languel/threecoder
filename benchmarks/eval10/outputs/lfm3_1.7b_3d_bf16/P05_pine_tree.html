<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Evergreen</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #173f40;
      --paper: rgba(247, 244, 233, 0.88);
      --muted: #64717a;
      --accent: #6e8c89;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9ddd5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: clamp(24px, 5vw, 68px);
      left: clamp(22px, 4vw, 52px);
      width: min(430px, calc(100vw - 44px));
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--ink);
      font-size: clamp(18px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 76px);
      font-weight: 360;
      line-height: 0.92;
      letter-spacing: -0.035em;
    }

    h1 span {
      color: var(--muted);
      font-weight: 350;
    }

    .subtitle {
      max-width: 340px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.65;
    }

    .controls {
      position: absolute;
      right: clamp(20px, 4vw, 48px);
      bottom: clamp(20px, 5vw, 38px);
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.035em;
    }

    .hint {
      padding-left: 8px;
      border-right: 1px solid rgba(98, 143, 137, 0.18);
    }

    .hint::after {
      content: "";
      height: 1px;
      margin-left: 6px;
      background: var(--ink);
    }

    button {
      border: 1px solid rgba(98, 143, 137, 0.22);
      border-radius: 999px;
      padding: 10px 15px;
      color: #fffaf0;
      background: rgba(247, 244, 233, 0.88);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition:
        transform 160ms ease,
        background 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #fffaf0;
    }

    @media (max-width: 700px) {
      .title {
        top: 18px;
        left: 18px;
        width: calc(100vw - 36px);
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        display: none;
      }

      .controls {
        right: 16px;
        bottom: 16px;
        left: 16px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main id="viewport"></main>

  <div class="overlay">
    <section class="title" aria-label="Scene description">
      <div class="eyebrow">Alpine study · 01</div>
      <h1>Low-Poly Evergreen</h1>
      <p class="subtitle">
        A tapered conifer with exposed roots, mossy rock, and four snow-dusted cones.
      </p>
    </section>

    <div class="controls">
      <span class="hint" id="reset-camera">Reset view</span>
      <button id="reset-camera" type="button">Reset camera</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, and lighting
    // -------------------------------------------------------------------------

    const viewport = document.querySelector("#viewport");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0xd9ddd5);
    scene.fog = new THREE.Fog(0xd9ddd5, 28, 72);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    // -------------------------------------------------------------------------
    // Procedural moss texture
    // -------------------------------------------------------------------------

    function makeMossTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;

      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 256, 0);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.45, "#8f9a9c");
      gradient.addColorStop(1, "#737a73");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 256);

      let seed = 73129;
      let random = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 900; i++) {
        const x = random() * 256;
        const y = random() * 256;

        ctx.fillStyle =
          `rgba(42, 43, 40, ${0.035 + random() * 0.07})`;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (random() - 0.5) * 2, y - 1);
        ctx.lineTo(x + (random() - 0.5) * 3, y - 3);
        ctx.stroke();

        const dot = random() > 0.5
          ? "rgba(255,255,255,0)"
          : "rgba(0,0,0,0)";

        ctx.fillStyle = dot;
        ctx.font = "700 9px ui-monospace, SFMono-Regular";
        ctx.fillText(`${String(random() * 26).padStart(2, "0")}`, 0, 0.25);
      }

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4.5, 3.5);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return texture;
    }

    const mossTexture = makeMossTexture();

    // -------------------------------------------------------------------------
    // Deterministic random helpers
    // -------------------------------------------------------------------------

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(73129);

    // -------------------------------------------------------------------------
    // Procedural grass for the rock patch
    // -------------------------------------------------------------------------

    function createGrassTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;

      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(canvas.width, canvas.height);

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const index = (y * canvas.width + x) * 4;
          const light = Math.random() > 0.5;

          image.data[index] = light
            ? 185
            : light
              ? 80
              : 40;

          image.data[index + 1] = light
            ? 105
            : light
              ? 42
              : 22;

          image.data[index + 2] = light
            ? 70
            : light
              ? 30
              : 18;

          image.data[index + 3] = 255;
        }
      }

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4.5, 4.5);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return texture;
    }

    const grassTexture = createGrassTexture();

    // -------------------------------------------------------------------------
    // Procedural rock texture
    // -------------------------------------------------------------------------

    function createRockTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");
      const random = mulberry32(4419);

      for (let i = 0; i < 10000; i++) {
        const x = random() * 512;
        const y = random() * 512;
        const radius = 0.45 + random() * 1.15;

        ctx.fillStyle =
          `rgba(35, 48, 43, ${0.025 + random() * 0.075})`;

        ctx.beginPath();
        ctx.ellipse(x, y, radius, radius * 1.65, random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();

        const bump = 0.8 + random() * 0.25;
        ctx.strokeStyle = `rgba(55, 58, 54, ${bump})`;
        ctx.lineWidth = 0.5 + random() * 1.5;
        ctx.beginPath();
        ctx.moveTo(x - radius, y);
        ctx.lineTo(x + radius, y);
        ctx.stroke();
      }

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3.5, 2.2);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return texture;
    }

    const rockTexture = createRockTexture();

    // -------------------------------------------------------------------------
    // Mossy rock
    // -------------------------------------------------------------------------

    function makeMossRock() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");
      const random = mulberry32(4419);

      for (let i = 0; i < 9500; i++) {
        const x = random() * 512;
        const y = random() * 512;

        ctx.fillStyle =
          `rgba(42, 43, 40, ${0.025 + random() * 0.07})`;

        ctx.fillRect(x, y, 1 + random() * 2, 1 + random() * 3);
      }

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 5);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // A subtle mossy edge.
      const edgeCanvas = document.createElement("canvas");
      edgeCanvas.width = 512;
      edgeCanvas.height = 512;

      const edgeCtx = edgeCanvas.getContext("2d");
      const gradient = edgeCtx.createRadialGradient(
        256,
        256,
        0,
        256,
        256,
        128
      );

      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.22, "#9eb4a5");
      gradient.addColorStop(1, "#737a73");

      edgeCtx.fillStyle = gradient;
      edgeCtx.fillRect(0, 0, 512, 512);

      var texture = new THREE.CanvasTexture(edgeCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      return texture;
    }

    const mossRock = makeMossRock();

    // -------------------------------------------------------------------------
    // Pine geometry
    // -------------------------------------------------------------------------

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: mossTexture,
      roughness: 0.84,
      metalness: 0
    });

    const branchMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: mossTexture,
      roughness: 0.9,
      metalness: 0
    });

    const nodeMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: mossTexture,
      roughness: 0.95,
      metalness: 0
    });

    const coneMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0xe8f5e7,
        roughness: 0.9,
        metalness: 0
      }),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: mossTexture,
        roughness: 1,
        metalness: 0
      }),
      new THREE.MeshStandardMaterial({
        color: 0xf5f7f4,
        roughness: 0.95,
        metalness: 0
      }),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: mossTexture,
        roughness: 1,
        metalness: 0
      })
    ];

    function addCone(parent, position, scale, rotation, offset = [0, 0, 0]) {
      const cone = new THREE.Mesh(
        new THREE.SphereGeometry(1, 24, 16),
        coneMaterials[position % coneMaterials.length]
      );

      cone.position.set(position[0], position[1], position[2]);
      cone.scale.set(scale[0], scale[1], scale[2]);
      cone.rotation.set(rotation.x, rotation.y, rotation.z);
      cone.castShadow = true;
      cone.receiveShadow = true;

      parent.add(cone);
      return cone;
    }

    function addBranch(parent, start, end, radius, material, segments = 8) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);

      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      parent.add(mesh);
      return mesh;
    }

    function addLeaf(parent, position, scale) {
      const group = new THREE.Group();
      group.position.copy(position);

      const leaf = new THREE.Mesh(
        new THREE.IcosahedronGeometry(scale[0], 1),
        nodeMaterial
      );

      leaf.castShadow = true;
      leaf.receiveShadow = true;

      group.add(leaf);
      parent.add(group);
      return group;
    }

    function addFoliage(parent, position, scale, offset) {
      const root = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.22, 1, 10),
        nodeMaterial
      );

      root.position.set(position[0], position[1], position[2]);
      root.castShadow = true;
      parent.add(root);

      const leaf = new THREE.Mesh(
        new THREE.IcosahedronGeometry(scale[0], 1),
        nodeMaterial
      );

      leaf.position.set(position[0], position[1], position[2] + offset[1]);
      leaf.castShadow = true;
      parent.add(leaf);
    }

    // -------------------------------------------------------------------------
    // Ground and subtle terrain
    // -------------------------------------------------------------------------

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xd9d8d3,
      roughness: 1
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.012;
    ground.receiveShadow = true;
    scene.add(ground);

    const rockPatch = new THREE.Mesh(
      new THREE.PlaneGeometry(22, 20),
      new THREE.MeshStandardMaterial({
        map: mossTexture,
        roughness: 1
      })
    );

    rockPatch.position.set(0, 0.012, -0.05);
    rockPatch.receiveShadow = true;
    scene.add(rockPatch);

    const rockRidge = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 1),
      new THREE.MeshStandardMaterial({
        color: 0xf0f0e8,
        roughness: 1
      })
    );

    rockRidge.position.set(0, 0.016, -0.03);
    rockRidge.receiveShadow = true;
    scene.add(rockRidge);

    // -------------------------------------------------------------------------
    // Mossy rocks with moss-covered roots
    // -------------------------------------------------------------------------

    function makeRock(parent, position, scale, offset) {
      const rock = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        mossTexture
      );

      rock.position.copy(position);
      rock.scale.set(scale[0], scale[1], scale[2]);
      rock.rotation.x = (random() - 0.5) * 0.08;
      rock.receiveShadow = true;

      parent.add(rock);

      const rootCount = 8 + Math.floor(random() * 4);
      const rootRadius = 0.12 + random() * 0.16;

      for (let i = 0; i < rootCount; i++) {
        const angle = random() * Math.PI * 2;
        const distance = 1.5 + random() * 3.5;

        const endX = position[0] + Math.cos(angle) * distance;
        const endY = position[1] + Math.sin(angle) * distance;

        addCone(
          parent,
          [endX, endY, position[2] + offset[1]],
          [rootRadius, 0.22, 0.15],
          [angle, 0, random() * Math.PI]
        );
      }
    }

    function makeRockGeometry() {
      const shape = new THREE.Shape();
      shape.moveTo(-0.42, -0.32);
      shape.lineTo(0.42, -0.32);
      shape.lineTo(0.32, 0.24);
      shape.lineTo(-0.10, 0.52);
      shape.lineTo(-0.15, 0.78);
      shape.lineTo(-0.40, 0.76);
      shape.closePath();

      return new THREE.ExtrudeGeometry(shape, {
        depth: 0.28,
        bevelEnabled: true,
        bevelThickness: 0.12,
        bevelSize: 0.12,
        bevelSegments: 2
      });
    }

    const rockGeometry = makeRockGeometry();

    makeRock(scene, [0, 0.025, -0.05], [1.35, 0.78, 0.42], [0, 0, 0.15]);
    makeRock(scene, [-1.45, 0.03, -0.18], [0.85, 0.25, 0.32], [0, 0, 0.2]);
    makeRock(scene, [0.12, 0.02, -0.72], [0.78, 0.39, 0.48], [-0.2, 0, 0.05]);
    makeRock(scene, [1.62, 0.05, -0.15], [0.35, 0.34, 0.31], [0, 0, 0.22]);

    // -------------------------------------------------------------------------
    // Tapered pine tree
    // -------------------------------------------------------------------------

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.17, 0.24, 7.8, 16),
      trunkMaterial
    );

    trunk.position.set(0, 2.45, -0.15);
    trunk.castShadow = true;
    trunk.receiveShadow = true;

    scene.add(trunk);

    const mainCrown = new THREE.Mesh(
      new THREE.CylinderGeometry(1.16, 1.28, 4.7, 24),
      nodeMaterial
    );

    mainCrown.position.set(0, 5.45, -0.15);
    mainCrown.castShadow = true;
    mainCrown.receiveShadow = true;

    scene.add(mainCrown);

    // A few thick lower branches make the taper read clearly.
    addBranch(scene, [0, 3.2, -0.17], [0.45, 1.55, -0.08], 0.15);
    addBranch(scene, [0, 2.55, -0.12], [-0.8, 1.25, 0.02], 0.13);
    addBranch(scene, [0, 1.65, -0.09], [0.65, 0.72, 0.02], 0.15);

    // -------------------------------------------------------------------------
    // Four stacked snow-dusted cones
    // -------------------------------------------------------------------------

    const coneRoots = [];
    const coneBaseY = 4.38;

    for (let i = 0; i < 4; i++) {
      const offset = [0, 0, 0];
      const angle = (i / 4) * Math.PI * 2 + 0.12;
      const radius = 0.72 + random() * 0.18;

      const cone = new THREE.Group();
      cone.position.set(
        Math.cos(angle) * radius,
        coneBaseY + 1.25,
        Math.sin(angle) * radius
      );

      cone.scale.set(0.86, 0.85, 0.74);
      cone.castShadow = true;
      cone.receiveShadow = true;

      scene.add(cone);

      const crown = new THREE.Mesh(
        new THREE.SphereGeometry(1, 28, 16),
        nodeMaterial
      );

      crown.position.z = -0.35;
      crown.scale.setScalar(0.66);
      crown.castShadow = true;
      cone.add(crown);

      const ringMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1
      });

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1, 0.035, 8, 36),
        ringMaterial
      );

      ring.position.set(0, 0.12, -0.46);
      ring.scale.setScalar(0.76);
      ring.castShadow = true;
      cone.add(ring);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(1, 24, 16),
        nodeMaterial
      );

      tip.position.z = -0.58;
      tip.scale.setScalar(0.72);
      tip.castShadow = true;
      cone.add(tip);

      // Small snowy dust particles.
      const snowCount = 18;
      const snowPositions = new Float32Array(snowCount * 3);

      for (let j = 0; j < snowCount; j++) {
        const angle = random() * Math.PI * 2;
        const radius = 0.12 + random() * 0.16;

        snowPositions[j * 3] = radius * Math.cos(angle);
        snowPositions[j * 3 + 1] = -0.15 + (random() - 0.5) * 1.35;
        snowPositions[j * 3 + 2] = -0.35 + random() * 1.25;
      }

      const snowGeometry = new THREE.BufferGeometry();
      snowGeometry.setAttribute("position", new THREE.BufferAttribute(snowPositions, 3));

      const snow = new THREE.Points(
        snowGeometry,
        new THREE.PointsMaterial({
          color: 0xf4f8ff,
          size: 0.045,
          transparent: true,
          opacity: 0.82,
          depthWrite: false
        })
      );

      scene.add(snow);
    }

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0xfff4e8, 0x66765e, 1.15);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xffefd5, 3.2);
    sun.position.set(-7, 13, 9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -5;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.035;

    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xc8dce2, 1.05);
    fill.position.set(8, 6, 4);
    scene.add(fill);

    // -------------------------------------------------------------------------
    // Custom orbit camera controls: drag to orbit, wheel/pinch to zoom
    // -------------------------------------------------------------------------

    const cameraTarget = new THREE.Vector3(0, 2.8, -0.55);
    let radius = 10.5;
    let azimuth = 0.58;
    let elevation = 1.06;

    function updateCamera() {
      const horizontalRadius = radius * Math.sin(elevation);

      camera.position.set(
        cameraTarget.x + horizontalRadius * Math.sin(azimuth),
        cameraTarget.y + radius * Math.cos(elevation),
        cameraTarget.z + horizontalRadius * Math.cos(azimuth)
      );

      camera.lookAt(cameraTarget);
    }

    var resetCamera = function() {
      azimuth = 0.58;
      elevation = 1.06;
      radius = 10.5;
      updateCamera();
    }

    const canvas = renderer.domElement;

    canvas.addEventListener("contextmenu", event => event.preventDefault());

    canvas.addEventListener("pointerdown", event => {
      canvas.setPointerCapture(event.pointerId);

      if (event.pointerType === "mouse" && event.button !== 0) return;

      if (event.shiftKey || event.canceled) {
        canvas.style.cursor = "grabbing";
      } else {
        canvas.style.cursor = "grabbing";
      }
    });

    canvas.addEventListener("pointermove", event => {
      if (!canvas.hasPointerCapture(event.pointerId)) return;

      const dx = event.clientX - canvas.getPointerX();
      const dy = event.clientY - canvas.getPointerY();

      canvas.setPointerCapture(event.pointerId);

      if (canvas.hasPointerCapture(event.pointerId)) {
        const previous = canvas.getPointerPosition();

        const dx2 = event.clientX - previous.x;
        const dy2 = event.clientY - previous.y;

        azimuth -= dx2 * 0.006;
        elevation += dy2 * 0.005;
      }
    });

    function releasePointer(event) {
      canvas.releasePointerCapture(event.pointerId);
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    canvas.addEventListener(
      "wheel",
      event => {
        event.preventDefault();
        radius *= Math.exp(event.deltaY * 0.001);

        radius = THREE.MathUtils.clamp(radius, 7.5, 15.5);
        updateCamera();
      },
      { passive: false }
    );

    canvas.addEventListener("dblclick", resetCamera);
    canvas.addEventListener("contextmenu", event => event.preventDefault());

    let dragging = false;
    let dragX = 0;
    let dragY = 0;

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      dragX = event.clientX;
      dragY = event.clientY;
      canvas.style.cursor = "grabbing";
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;

      const dx = event.clientX - dragX;
      const dy = event.clientY - dragY;

      dragX += dx;
      dragY += dy;

      azimuth -= dx * 0.006;
      elevation += dy * 0.005;
    });

    function endDrag(event) {
      dragging = false;

      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      radius *= Math.exp(event.deltaY * 0.001);
      radius = THREE.MathUtils.clamp(radius, 7.5, 15.5);
      updateCamera();
    }, { passive: false });

    var resetCamera = function() {
      azimuth = 0.58;
      elevation = 1.06;
      radius = 10.5;
      updateCamera();
    }

    document.querySelector("#reset-camera").addEventListener("click", resetCamera);

    // -------------------------------------------------------------------------
    // Resize and render loop
    // -------------------------------------------------------------------------

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);
    resize();

    let firstFrame = true;

    function animate() {
      requestAnimationFrame(animate);

      updateCamera();
      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        renderer.setClearColor(0xffffff);
      }
    }

    animate();
  </script>
</body>
</html>
