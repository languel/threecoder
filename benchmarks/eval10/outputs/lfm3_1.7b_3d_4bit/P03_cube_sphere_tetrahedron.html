<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matte Crimson · Cobalt · Emerald</title>

  <style>
    :root {
      --ink: #f5fff0;
      --muted: rgba(22, 23, 25, 0.62);
      --paper: #111417;
      --line: rgba(18, 20, 21, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, #10171d 0%, #07111d 55%, #040707 100%),
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 48%,
          transparent 38%,
          rgba(0, 0, 0, 0.18) 100%
        );
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .title-card {
      position: absolute;
      top: 26px;
      left: 28px;
      max-width: min(360px, calc(100vw - 56px));
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px) saturate(1.05);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
      color: #d79b65;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 18px;
      height: 1px;
      content: "";
      background: #f5d9a2;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 350px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      position: absolute;
      right: 28px;
      bottom: 26px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      background: rgba(26, 27, 29, 0.82);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    button:hover {
      border-color: rgba(18, 20, 21, 0.5);
      background: rgba(47, 49, 50, 0.95);
    }

    .hint {
      position: absolute;
      left: 28px;
      bottom: 27px;
      color: rgba(22, 24, 25, 0.58);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hint span {
      color: var(--muted);
    }

    .controls .hint {
      display: none;
    }

    @media (max-width: 700px) {
      .title-card {
        top: 20px;
        left: 20px;
      }

      .subtitle,
      .hint {
        display: none;
      }

      .controls {
        right: 20px;
        bottom: 20px;
      }

      button {
        flex: 1;
        padding: 9px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="vignette"></div>

  <div class="hud">
    <section class="title-card" aria-label="Scene information">
      <div class="eyebrow">Object study · No. 01</div>
      <h1>Matte Crimson<br />Cobalt<br />Emerald</h1>
      <p class="subtitle">Three objects arranged on a dark slate plinth.</p>
    </section>

    <div class="hint">
      <span>Drag to orbit · Scroll to zoom · Double-click to reset</span>
    </div>

    <div class="controls" aria-label="Scene controls">
      <button id="orbitButton" type="button">Auto orbit</button>
      <button id="resetButton" type="button">Reset view</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer, camera and lighting
    // -------------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(renderer.innerWidth, renderer.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.domElement.setAttribute(
      "aria-label",
      "Interactive three-dimensional scene with a matte crimson cube, a glowing cobalt sphere, and an emerald tetrahedron"
    );

    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x11171d);
    scene.fog = new THREE.FogExp2(0x11171d, 0.024);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    const rendererTarget = new THREE.Vector3(0, 2.4, 0);
    let theta = 0.78;
    let phi = 1.08;
    let radius = 14.2;

    function updateCamera() {
      camera.position.set(
        cameraTarget.x + radius * Math.sin(phi) * Math.sin(theta),
        cameraTarget.y + radius * Math.cos(phi),
        cameraTarget.z + radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(cameraTarget);
    }

    updateCamera();

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x9bcbd5, 0.45, 1.15));

    const keyLight = new THREE.DirectionalLight(0xfff2d8, 3.7);
    keyLight.position.set(6, 12, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -9;
    keyLight.shadow.camera.right = 9;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -7;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.00035;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x2b9bd6, 2.6);
    rimLight.position.set(-7, 8, 5);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xffc58a, 18, 17, 2);
    warmFill.position.set(4, 5, 3);
    scene.add(warmFill);

    // -------------------------------------------------------------------------
    // Matte crimson cube and glossy cobalt sphere
    // -------------------------------------------------------------------------

    const matteCube = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, 1.15, 1.15),
      new THREE.MeshStandardMaterial({
        color: 0x3d1519,
        roughness: 0.82,
        metalness: 0
      })
    );

    matteCube.position.set(-2.35, 2.25, -0.45);
    matteCube.castShadow = true;
    matteCube.receiveShadow = true;
    scene.add(matteCube);

    const sphereGeometry = new THREE.SphereGeometry(1, 64, 32);
    const cobaltSphere = new THREE.Mesh(sphereGeometry, new THREE.MeshPhysicalMaterial({
      color: 0x2b7cc5,
      emissive: 0x030f3d,
      emissiveIntensity: 0.65,
      roughness: 0.24,
      metalness: 0.02,
      transmission: 0.72
    }));

    cobaltSphere.position.set(-2.35, 2.25, 1.15);
    cobaltSphere.scale.z = -1.05;
    cobaltSphere.receiveShadow = true;
    scene.add(cobaltSphere);

    // -------------------------------------------------------------------------
    // Emerald tetrahedron
    // -------------------------------------------------------------------------

    const tetrahedron = new THREE.Mesh(
      new THREE.SphereGeometry(0.72, 48, 30),
      new THREE.MeshStandardMaterial({
        color: 0x4e9c49,
        roughness: 0.34,
        metalness: 0
      })
    );

    tetrahedron.position.set(2.35, 2.25, -1.5);
    tetrahedron.scale.set(0.75, 0.75, 0.7);
    tetrahedron.castShadow = true;
    tetrahedron.receiveShadow = true;
    scene.add(tetrahedron);

    // -------------------------------------------------------------------------
    // Dark slate plinth and fine grid
    // -------------------------------------------------------------------------

    const plinth = new THREE.Mesh(
      new THREE.CylinderGeometry(3.5, 3.5, 0.32, 96),
      new THREE.MeshStandardMaterial({
        color: 0x11171d,
        roughness: 0.76
      })
    );

    plinth.position.set(0, 1.45, -0.8);
    plinth.receiveShadow = true;
    scene.add(plinth);

    const plinthGrid = new THREE.GridHelper(6.2, 6.2, 0x18213a, 0x11171d);
    plinthGrid.position.set(0, 1.45, -4.15);
    plinthGrid.material.transparent = true;
    plinthGrid.material.opacity = 0.16;
    scene.add(plinthGrid);

    const grid = new THREE.LineSegments(
      new THREE.QuadrantGeometry(3.35, 3.35, 96),
      new THREE.LineDashedMaterial({
        color: 0x1d2528,
        dashSize: 0.11,
        gapSize: 0.055
      })
    );
    grid.position.set(0, 1.45, -4.2);
    scene.add(grid);

    // -------------------------------------------------------------------------
    // Custom orbit controls: drag, wheel zoom and keyboard reset
    // -------------------------------------------------------------------------

    const orbitButton = document.getElementById("orbitButton");
    const resetButton = document.getElementById("resetButton");

    function updateCameraFromState() {
      theta = THREE.MathUtils.degToRad(theta);
      phi = THREE.MathUtils.degToRad(phi);
      radius = THREE.MathUtils.degToRad(radius);

      camera.position.set(
        cameraTarget.x + radius * Math.sin(phi) * Math.sin(theta),
        cameraTarget.y + radius * Math.cos(phi),
        cameraTarget.z + radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(cameraTarget);
    }

    function resetView() {
      theta = 0.78;
      phi = 1.08;
      radius = 14.2;
      updateCamera();
    }

    orbitButton.addEventListener("click", () => {
      const dragging = false;

      if (dragMode === 3) {
        orbitButton.classList.remove("active");
        orbitButton.textContent = "Auto orbit";
        updateCameraFromState();
        return;
      }

      dragMode = 1;
      orbitButton.classList.add("active");
      orbitButton.textContent = "Drag to orbit";
      updateCameraFromState();
    });

    resetButton.addEventListener("click", resetView);
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "r") {
        resetView();
      }
    });

    // -------------------------------------------------------------------------
    // Resize and render loop
    // -------------------------------------------------------------------------

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
    }

    window.addEventListener("resize", resize);

    let autoOrbit = false;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button === 0) {
        dragMode = 3;
        orbitButton.classList.add("active");
        orbitButton.textContent = "Auto orbit";
        updateCameraFromState();
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse" && event.pointerType !== "wheel") {
        const dx = event.deltaX;
        const dy = event.deltaY;

        theta -= dx * 0.006;
        phi = THREE.MathUtils.clamp(phi - dy * 0.005, 0.48, 1.38);
      }
    });

    renderer.domElement.addEventListener("pointerup", () => {
      dragMode = 0;
      orbitButton.classList.remove("active");
      orbitButton.textContent = "Auto orbit";
      updateCameraFromState();
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragMode = 0;
    });

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      radius = THREE.MathUtils.clamp(radius * Math.exp(event.deltaY * 0.001), 10, 22);
      updateCamera();
    }, { passive: false });

    window.addEventListener("resize", resize);
    resize();

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
