<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Geometric Study</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, #15171d 0%, #090b10 48%, #040b0c 100%);
      color: #f7ffff;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: linear-gradient(
        145deg,
        rgba(18, 25, 32, 0.92),
        rgba(17, 21, 27, 0.78)
      );
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .eyebrow {
      margin-bottom: 7px;
      color: #d6b47f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 36px);
      line-height: 1;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #9aafb8;
      font-size: 13px;
      line-height: 1.5;
    }

    .actions {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: linear-gradient(135deg, #d6b47f, #9b783c);
      color: #211820;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 8px 26px rgba(71, 52, 31, 0.22);
      transition:
        transform 150ms ease,
        filter 150ms ease,
        opacity 150ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 44px));
      padding: 11px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(18, 25, 32, 0.82);
      color: #9aafb8;
      font-size: 12px;
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel {
        top: 12px;
        left: 12px;
      }

      .subtitle {
        display: none;
      }

      #status {
        bottom: 16px;
      }
    }
  </style>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.querySelector("#viewport");
    const exportButton = document.querySelector("#export");
    const status = document.querySelector("#status");

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x071019);
    scene.fog = new THREE.Fog(0x071019, 12, 28);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.55, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.5;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemisphere = new THREE.HemisphereLight(0xc9eaff, 0x24151c, 1.7);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffd5a8, 3.2);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 9;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4bb8d7, 2.1);
    rimLight.position.set(-7, 5, -6);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xffd49f, 18, 12, 2);
    warmFill.position.set(3, 3, 4);
    scene.add(warmFill);

    // Presentation-only ground. It is deliberately not included in the exported GLB.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x090d14,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.005;
    ground.receiveShadow = true;
    scene.add(ground);

    const asset = new THREE.Group();
    asset.name = "LowPoly_Geometric_Study";
    asset.userData = {
      assetType: "Static low-poly study",
      dimensions: "cm",
      materials: ["matte crimson", "cobalt", "emerald", "slate"]
    };
    scene.add(asset);

    function addMesh(
      parent,
      geometry,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = [1, 1, 1],
      castShadow = true
    ) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.scale.set(...scale);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = castShadow;
      parent.add(mesh);
      return mesh;
    }

    function addBox(
      parent,
      size,
      position,
      material,
      rotation = [0, 0, 0],
      castShadow = true
    ) {
      return addMesh(
        parent,
        new THREE.BoxGeometry(...size),
        material,
        position,
        rotation,
        [1, 1, 1],
        castShadow
      );
    }

    function addCylinder(
      parent,
      radius,
      height,
      position,
      material,
      segments = 8,
      castShadow = true
    ) {
      return addMesh(
        parent,
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material,
        position,
        [Math.PI / 2, 0, 0],
        [1, 1, 1],
        castShadow
      );
    }

    function addSphere(
      parent,
      radius,
      position,
      material,
      scale = [1, 1, 1],
      castShadow = true
    ) {
      return addMesh(
        parent,
        new THREE.SphereGeometry(radius, 12, 8),
        material,
        position,
        [0, 0, 0],
        scale,
        castShadow
      );
    }

    function addTorus(
      parent,
      radius,
      tube,
      position,
      rotation,
      material,
      segments = 20
    ) {
      return addMesh(
        parent,
        new THREE.TorusGeometry(radius, tube, segments),
        material,
        position,
        [0, 0, 0],
        [1, 1, 1],
        false
      );
    }

    function addIcosahedron(parent, radius, position, material) {
      return addMesh(
        parent,
        new THREE.IcosahedronGeometry(radius, 1),
        material,
        position,
        [0, 0, 0],
        [1, 1, 1],
        false
      );
    }

    // ------------------------------------------------------------------
    // Matte crimson cube
    // ------------------------------------------------------------------

    const cube = new THREE.Group();
    cube.name = "Matte_Crimson_Cube";
    asset.add(cube);

    addBox(
      cube,
      [0.75, 1.15, 0.45],
      [0, 1.55, -0.12],
      "matte crimson",
      [0, 0, 0]
    );

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      addBox(
        cube,
        [0.12, 1.08, 0.16],
        [
          Math.cos(angle) * 0.42,
          1.55,
          Math.sin(angle) * 0.42
        ],
        "matte crimson",
        [0, 0, angle]
      );
    }

    // ------------------------------------------------------------------
    // Glossy cobalt sphere
    // ------------------------------------------------------------------

    const sphere = new THREE.Group();
    sphere.name = "Cobalt_Sphere";
    asset.add(sphere);

    addSphere(
      sphere,
      0.72,
      [0, 1.65, 0],
      "cobalt",
      [1, 0.95, 0.75],
      false
    );

    // A subtle emissive halo makes the glasear behavior readable in the renderer.
    const halo = new THREE.Mesh(
      new THREE.TorusGeometry(0.66, 0.022, 6, 16),
      new THREE.MeshBasicMaterial({
        color: 0x1b4d8c,
        emissive: 0x2e5f9a,
        emissiveIntensity: 3.2
      })
    );
    halo.position.y = 1.78;
    sphere.add(halo);

    // ------------------------------------------------------------------
    // Emerald tetrahedron
    // ------------------------------------------------------------------

    const tetrahedron = new THREE.Group();
    tetrahedron.name = "Emerald_Tetrahedron";
    asset.add(tetrahedron);

    addIcosahedron(
      tetrahedron,
      0.17,
      [0, 1.72, 0],
      "emerald"
    );

    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * Math.PI * 2;
      addBox(
        tetrahedron,
        [0.12, 0.12, 0.12],
        [
          Math.cos(angle) * 0.25,
          1.72 + Math.sin(angle) * 0.25,
          Math.sin(angle) * 0.25
        ],
        "emerald",
        [0, 0, angle]
      );
    }

    // ------------------------------------------------------------------
    // Dark slate plinth
    // ------------------------------------------------------------------

    const plinth = new THREE.Group();
    plinth.name = "Dark_Slate_Plinth";
    asset.add(plinth);

    addBox(
      plinth,
      [1.65, 0.16, 0.38],
      [0, -0.05, 0],
      "matte slate",
      [0, 0, 0]
    );

    for (let i = 0; i < 5; i++) {
      addBox(
        plinth,
        [0.3, 0.18, 0.035],
        [-0.19 + i * 0.23, 0.085, -0.155],
        "matte slate",
        [0, 0, 0]
      );
    }

    addBox(
      plinth,
      [1.6, 0.045, 0.035],
      [0, 0.205, -0.165],
      "matte slate",
      [0, 0, 0]
    );

    // ------------------------------------------------------------------
    // Export
    // ------------------------------------------------------------------

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Building GLB…";

      asset.updateMatrixWorld(true);

      const exporter = new GLTFExporter();
      exporter.parse(
        asset,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "low_poly_geometric_study.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          status.textContent = "GLB downloaded successfully";
          exportButton.disabled = false;
        },
        (error) => {
          console.error("GLB export failed:", error);
          status.textContent = "Export failed — see browser console";
          exportButton.disabled = false;
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false,
          maxTextureSize: 4096
        }
      );
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
