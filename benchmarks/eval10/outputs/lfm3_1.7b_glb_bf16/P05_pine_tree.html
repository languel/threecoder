<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stylized Low-Poly Evergreen Pine Tree</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, #2d9b4f 0%, #1d5e22 38%, #081417 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .panel {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      width: min(360px, calc(100vw - 56px));
      padding: 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #edf5ff;
      background: linear-gradient(
        145deg,
        rgba(18, 35, 25, 0.9),
        rgba(10, 17, 15, 0.76)
      );
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #dca17b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .description {
      margin: 10px 0 16px;
      color: #9ca3a8;
      font-size: 13px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 20px;
    }

    .stat-block {
      padding: 10px 14px;
    }

    .stat-number {
      color: #f5ffff;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    .stat-label {
      color: #a9b9a7;
      font-size: 12px;
      line-height: 1.35;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      color: #071019;
      background: linear-gradient(135deg, #e2d9a6, #b99b4c);
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 150ms ease, filter 150ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.35);
      opacity: 0.65;
    }

    .hint {
      position: fixed;
      right: 24px;
      bottom: 22px;
      z-index: 10;
      color: rgba(224, 235, 233, 0.7);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel {
        top: 14px;
        left: 14px;
        width: calc(100vw - 28px);
        padding: 16px;
      }

      .description {
        margin-bottom: 12px;
      }

      .stats {
        margin-bottom: 14px;
      }

      .hint {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div class="panel">
    <p class="eyebrow">Low-poly asset asset</p>
    <h1>Evergreen Pine Tree</h1>
    <p class="description">
      A stylized evergreen pine with tapered bark, exposed roots, four stacked
      snow-dusted foliage cones, and a mossy rock patch.
    </p>

    <div class="stats">
      <div class="stat-block">
        <span class="stat-number">Low-poly</span>
        <span class="stat-label">Static asset</span>
      </div>
      <div class="stat-block">
        <span class="stat-number">4 cones</span>
        <span class="stat-label">Foliage</span>
      </div>
      <div class="stat-block">
        <span class="stat-number">GLB ready</span>
        <span class="stat-label">Export button</span>
      </div>
    </div>

    <button id="exportButton" type="button">Export GLB</button>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x081417);
    scene.fog = new THREE.Fog(0x081417, 7, 18);

    const camera = new THREE.PerspectiveCamera(
      34,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    camera.position.set(4.8, 3.2, 6.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 3.5;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0x9db8c7, 0x17131d, 2.0));

    const keyLight = new THREE.DirectionalLight(0xd9f5ff, 3.1);
    keyLight.position.set(4.5, 8, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.00035;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7ab9ff, 1.35);
    fillLight.position.set(-5, 3, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffd6b2, 2.0);
    rimLight.position.set(2, 5, -7);
    scene.add(rimLight);

    // Preview-only floor.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x071019,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.9;
    ground.receiveShadow = true;
    scene.add(ground);

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(1.65, 2.0, 0.18, 12),
      new THREE.MeshStandardMaterial({
        color: 0x102d1d,
        roughness: 0.78,
        metalness: 0.02
      })
    );
    pedestal.position.y = -1.6;
    scene.add(pedestal);

    const pedestalRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.58, 0.045, 8, 12),
      new THREE.MeshBasicMaterial({
        color: 0x2c7d5b,
        transparent: true,
        opacity: 0.78
      })
    );
    pedestalRing.rotation.x = Math.PI / 2;
    pedestalRing.position.y = -1.55;
    scene.add(pedestalRing);

    // Tapered bark trunk.
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.23, 0.25, 9, 1, false),
      new THREE.MeshStandardMaterial({
        name: "Bark_Trunk",
        color: 0x3d2c20,
        roughness: 0.95,
        metalness: 0.02
      })
    );
    trunk.position.y = -2.45;
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    scene.add(trunk);

    const barkTop = new THREE.Mesh(
      new THREE.TorusGeometry(0.19, 0.022, 6, 12),
      new THREE.MeshStandardMaterial({
        name: "Bark_Top",
        color: 0x2d8f1f,
        roughness: 0.93,
        metalness: 0.01
      })
    );
    barkTop.position.y = -2.27;
    scene.add(barkTop);

    const barkSideRings = [
      new THREE.Mesh(
        new THREE.TorusGeometry(0.17, 0.018, 5, 12),
        new THREE.MeshStandardMaterial({
          name: "Bark_Side_Ring_1",
          color: 0x2c8f13,
          roughness: 1
        })
      ),
      new THREE.Mesh(
        new THREE.TorusGeometry(0.17, 0.018, 5, 12),
        new THREE.MeshStandardMaterial({
          name: "Bark_Side_Ring_2",
          color: 0x1f7b10,
          roughness: 1
        })
      ),
      new THREE.Mesh(
        new THREE.TorusGeometry(0.17, 0.018, 5, 12),
        new THREE.MeshStandardMaterial({
          name: "Bark_Side_Ring_3",
          color: 0x151b16,
          roughness: 1
        })
      ],
      new THREE.Mesh(
        new THREE.TorusGeometry(0.19, 0.018, 6, 12),
        new THREE.MeshStandardMaterial({
          name: "Bark_Top_Ring",
          color: 0x2d8f1f,
          roughness: 0.93,
          metalness: 0.01
        })
      )
    ];

    barkSideRings.forEach((ring, index) => {
      ring.position.y = -2.35;
      scene.add(ring);
    });

    // Exposed roots.
    const rootPositions = [
      [-1.4, 0.8],
      [1.4, 0.8],
      [-1.4, -0.8],
      [1.4, -0.8]
    ];

    rootPositions.forEach(([x, z], index) => {
      const root = new THREE.Mesh(
        new THREE.ConeGeometry(0.105, 0.75, 5),
        new THREE.MeshStandardMaterial({
          name: `Root_${index + 1}`,
          color: 0x2f5c38,
          roughness: 1,
          metalness: 0.02
        })
      );

      root.position.set(x, 0.45, z);
      root.castShadow = true;
      root.receiveShadow = true;
      scene.add(root);
    });

    // Four stacked snow-dusted foliage cones.
    const conePositions = [
      [-1.35, -0.55],
      [1.35, -0.55],
      [-1.35, 0.55],
      [1.35, 0.55]
    ];

    conePositions.forEach(([x, z], index) => {
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.18, 2.15, 5),
        new THREE.MeshStandardMaterial({
          name: `Snow_Stack_${index + 1}`,
          color: 0xffffff,
          roughness: 0.86,
          metalness: 0.04
        })
      );

      cone.position.set(x, 1.55, z);
      cone.castShadow = true;
      cone.receiveShadow = true;
      scene.add(cone);
    });

    // Mossy rock patch.
    const patch = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.34, 0),
      new THREE.MeshStandardMaterial({
        name: "Mossy_Rock_Patch",
        color: 0x2b5d43,
        roughness: 1,
        metalness: 0
      })
    );
    patch.position.set(0, -1.72, 0);
    scene.add(patch);

    const moss = new THREE.Mesh(
      new THREE.TorusGeometry(0.13, 0.018, 6, 10),
      new THREE.MeshStandardMaterial({
        name: "Moss_Clumps",
        color: 0x2b5d43,
        roughness: 1,
        metalness: 0
      })
    );
    moss.position.set(0, -1.72, 0);
    scene.add(moss);

    const mossRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.13, 0.018, 6, 10),
      new THREE.MeshBasicMaterial({
        name: "Moss_Rim",
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    mossRing.position.set(0, -1.72, 0);
    scene.add(mossRing);

    // Export only the asset hierarchy, excluding the ground and lighting.
    const exportRoot = new THREE.Group();
    exportRoot.name = "Evergreen_Pine_Tree";
    exportRoot.userData = {
      asset: "Stylized low-poly evergreen pine tree",
      style: "Low-poly",
      static: true,
      features: ["Tapered bark", "Exposed roots", "Snow-dusted foliage", "Mossy patch"]
    };
    scene.add(exportRoot);

    const exporter = new GLTFExporter();
    const exportButton = document.getElementById("exportButton");
    const exportButtonText = exportButton.querySelector("span");

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      exportButtonText.textContent = "Exporting…";

      try {
        exporter.parse(
          exportRoot,
          (result) => {
            const blob = new Blob([result], {
              type: "model/gltf-binary"
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "stylized_low_poly_evergreen_pine_tree.glb";
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            exportButtonText.textContent = "Exported GLB";
          },
          (error) => {
            console.error("GLB export failed:", error);
            exportButtonText.textContent = "Export Failed";
          },
          {
            binary: true,
            onlyVisible: true,
            trs: false,
            maxTextureSize: 4096
          }
        );
      } catch (error) {
        console.error("GLB export failed:", error);
        exportButtonText.textContent = "Export Failed";
      } finally {
        setTimeout(() => {
          exportButton.disabled = false;
          exportButtonText.textContent = "Export GLB";
        }, 1500);
      }
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);

    function render() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
