<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Red Fox</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090a0e;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(8, 10, 16, 0.78);
      color: #edf5f3;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #a96c2e;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #exportButton {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #e8b56c, #c9822f);
      box-shadow:
        0 8px 24px rgba(230, 153, 55, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      color: #211e18;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition:
        transform 160ms ease,
        filter 160ms ease,
        opacity 160ms ease;
    }

    #exportButton:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    #exportButton:active {
      transform: translateY(0);
    }

    #exportButton:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .hint {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 600px) {
      .panel {
        top: 12px;
        left: 12px;
      }

      .actions {
        flex-direction: column;
      }

      #exportButton {
        padding: 11px 14px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div class="panel">
    <div class="eyebrow">Low-poly character asset</div>
    <h1>Red Fox</h1>
    <p class="subtitle">
      A stylized fox with pointed ears, a white chest tuft, and a large
      fluffy white-tipped tail. The model is static and ready for export.
    </p>

    <div class="actions">
      <div id="exportButton" type="button">Export GLB</div>
    </div>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const scene = new THREE.Scene();
    window.scene = scene;
    window.THREE = THREE;
    scene.background = new THREE.Color(0x090a0e);
    scene.fog = new THREE.Fog(0x090a0e, 12, 22);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    window.camera = camera;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    window.renderer = renderer;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 5;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    scene.add(new THREE.HemisphereLight(0x9ce9ff, 0x07101f, 2.15));

    const keyLight = new THREE.DirectionalLight(0xffe3b5, 3.1);
    keyLight.position.set(4.5, 7, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 22;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x35dfff, 2.1);
    rimLight.position.set(-5, 3, -5);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xff9a42, 18, 14, 2);
    warmFill.position.set(-3.5, 2.5, 3.5);
    scene.add(warmFill);

    // Studio floor is presentation-only and is not part of the exported asset.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x10161b,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.06;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(24, 48, 0x2c3b47, 0x15191d);
    grid.position.y = -0.035;
    grid.material.transparent = true;
    grid.material.opacity = 0.28;
    scene.add(grid);

    const asset = new THREE.Group();
    asset.name = "LowPolyRedFox";
    asset.userData = {
      assetType: "Static low-poly fox character",
      style: "Stylized red fur",
      modelCount: 32
    };
    scene.add(asset);

    const materials = {
      skin: new THREE.MeshStandardMaterial({
        color: 0xa94f2d,
        roughness: 0.82,
        metalness: 0,
        flatShading: true
      }),
      skinLight: new THREE.MeshStandardMaterial({
        color: 0xb55c38,
        roughness: 0.8,
        metalness: 0,
        flatShading: true
      }),
      ear: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      earDark: new THREE.MeshStandardMaterial({
        color: 0xfff5e8,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      white: new THREE.MeshStandardMaterial({
        color: 0xf4f7f4,
        roughness: 0.98,
        metalness: 0,
        flatShading: true
      }),
      whiteTip: new THREE.MeshStandardMaterial({
        color: 0xe8dfc5,
        roughness: 0.96,
        metalness: 0,
        flatShading: true
      }),
      eye: new THREE.MeshStandardMaterial({
        color: 0x111a1d,
        roughness: 0.55,
        metalness: 0,
        flatShading: true
      })
    };

    function addMesh(geometry, material, name, parent = asset) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBox(size, position, material, name, parent = asset) {
      const mesh = addMesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        name,
        parent
      );
      mesh.position.set(position[0], position[1], position[2]);
      return mesh;
    }

    function addCylinder(
      radiusTop,
      radiusBottom,
      height,
      radialSegments,
      position,
      material,
      name,
      parent = asset
    ) {
      const mesh = addMesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          radialSegments,
          1,
          false
        ),
        material,
        name,
        parent
      );
      mesh.position.set(position[0], position[1], position[2]);
      return mesh;
    }

    function addSphere(
      radius,
      position,
      material,
      name,
      parent = asset
    ) {
      const mesh = addMesh(
        new THREE.SphereGeometry(radius, 10, 7),
        material,
        name,
        parent
      );
      mesh.position.set(position[0], position[1], position[2]);
      return mesh;
    }

    function addBone(
      fromA,
      toB,
      width,
      depth,
      material,
      name,
      parent = asset
    ) {
      const start = new THREE.Vector3(...fromA);
      const end = new THREE.Vector3(...toB);
      const direction = end.clone().sub(start);
      const length = direction.length();

      const mesh = addCylinder(
        width / 2,
        width / 2,
        length,
        6,
        [
          start.x + direction.x * (start.length / length),
          start.y + direction.y * (start.length / length),
          start.z + direction.z * (start.length / length)
        ],
        material,
        name,
        parent
      );

      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      return mesh;
    }

    // Neck and head.
    addBone(
      [-0.18, 2.05, 0],
      [0.04, 2.05, 0],
      0.10,
      0.11,
      materials.skin,
      "Neck"
    );

    addSphere(1, [0, 2.04, 0], materials.skin, "Head");
    addBox(
      [0.22, 0.19, 0.18],
      [0, 2.13, 0],
      materials.skinLight,
      "Nostril"
    );

    // White chest tuft.
    addSphere(1, [-0.09, 2.24, 0], materials.white, "CheekTuft");
    addBox(
      [0.18, 0.16, 0.17],
      [-0.10, 2.29, 0],
      materials.white,
      "UpperTuft"
    );
    addBox(
      [0.15, 0.13, 0.11],
      [-0.10, 2.20, 0],
      materials.white,
      "LowerTuft"
    );

    // Pointed ears.
    for (const side of [-1, 1]) {
      const x = side * 0.18;

      addCylinder(
        0.075,
        0.075,
        0.12,
        5,
        [x, 2.04, 0],
        materials.earDark,
        side < 0 ? "LeftEar" : "RightEar",
        asset
      );

      addCylinder(
        0.10,
        0.10,
        0.16,
        5,
        [x, 2.12, 0],
        materials.ear,
        side < 0 ? "LeftEarTip" : "RightEarTip",
        asset
      );

      // A small dark ear lobe adds a little extra detail.
      addSphere(
        0.045,
        [x, 2.05, 0.025],
        materials.earDark,
        side < 0 ? "LeftEarLobe" : "RightEarLobe",
        asset
      );
    }

    // Large fluffy white-tipped tail.
    const tailPoints = [
      { z: -1.12, y: 0.55 },
      { z: -0.90, y: 1.35 },
      { z: -0.70, y: 2.18 },
      { z: -0.40, y: 3.18 },
      { z: -0.00, y: 4.15 },
      { z: 0.40, y: 4.15 },
      { z: 0.70, y: 3.18 },
      { z: 0.90, y: 2.18 },
      { z: 1.12, y: 0.55 }
    ];

    tailPoints.forEach((point, index) => {
      const t = new THREE.Vector3(...point);
      const direction = new THREE.Vector3(...t.x, t.y, t.z).normalize();

      addCylinder(
        point.width,
        point.width,
        point.y * 0.35,
        6,
        [
          t.x + direction.x * (t.length / 1),
          t.y + direction.y * (t.length / 1),
          t.z + direction.z * (t.length / 1)
        ],
        materials.whiteTip,
        `TailPoint_${index + 1}`,
        asset
      );
    });

    // Pointed ears on the back side.
    for (const side of [-1, 1]) {
      const x = side * 0.18;

      addCylinder(
        0.08,
        0.08,
        0.12,
        5,
        [x, 2.04, 0],
        materials.earDark,
        side < 0 ? "LeftEarBack" : "RightEarBack",
        asset
      );

      addCylinder(
        0.10,
        0.10,
        0.16,
        5,
        [x, 2.13, 0],
        materials.ear,
        side < 0 ? "LeftEarBackTip" : "RightEarBackTip",
        asset
      );
    }

    // Front ear.
    addCylinder(
      0.09,
      0.09,
      0.11,
      5,
      [0, 2.04, 0],
      materials.earDark,
      "FrontEar",
      asset
    );

    addCylinder(
      0.10,
      0.10,
      0.16,
      5,
      [0, 2.13, 0],
      materials.ear,
      "FrontEarTip",
      asset
    );

    // Large white fluff tail.
    const tailVertices = [];
    const tailIndices = [];

    for (let i = 0; i < tailPoints.length; i++) {
      const t = tailPoints[i];
      const y = t.y * 0.35;
      t.y = y + 0.035;
      tailVertices.push(
        t.x,
        t.y,
        t.z
      );
    }

    for (let i = 0; i < tailPoints.length; i++) {
      const next = (i + 1) % tailPoints.length;

      for (let j = 0; j < 3; j++) {
        const a = i + j;
        const b = next + j;
        const c = next + j + 1;
        tailIndices.push(a, c, b);
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(tailVertices, 3)
    );
    geometry.setIndex(tailIndices);
    geometry.computeVertexNormals();

    addMesh(
      geometry,
      materials.whiteTip,
      "LargeFluffyWhiteTail"
    );

    // White tip points on the tail.
    for (let i = 0; i < tailPoints.length - 1; i++) {
      const a = tailPoints[i];
      const b = tailPoints[i + 1];

      addSphere(
        0.018,
        [a.x, a.y * 0.35 + 0.035, a.z],
        materials.whiteTip,
        `TailWhiteTip_${i}`
      );

      addBox(
        [0.025, 0.018, 0.018],
        [a.x, a.y * 0.35 + 0.035, a.z],
        materials.whiteTip,
        `TailWhiteTip_${i}_Upper`
      );

      addBox(
        [0.018, 0.018, 0.018],
        [a.x + (b.x - a.x) * 0.5, a.y * 0.35 + 0.035, a.z],
        materials.whiteTip,
        `TailWhiteTip_${i}_Lower`
      );
    }

    // Ensure all asset meshes cast shadows and receive shadow.
    asset.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Export only the character hierarchy, not the studio floor or lights.
    const exportButton = document.getElementById("exportButton");
    const exportRoot = asset.clone(true);

    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      exportButton.textContent = "Building GLB…";

      try {
        // Export the model and materials as a flat, low-poly GLB.
        const exporter = new GLTFExporter();

        exporter.parse(
          exportRoot,
          (result) => {
            const blob = new Blob([result], {
              type: "model/gltf-binary"
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "low_poly_red_fox.glb";
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 2000);

            exportButton.textContent = "Exported GLB";
            setTimeout(() => {
              exportButton.textContent = "Export GLB";
              exportButton.disabled = false;
            }, 1700);
          },
          (error) => {
            console.error("GLB export failed:", error);
            exportButton.textContent = "Export Failed";
            setTimeout(() => {
              exportButton.textContent = "Export GLB";
              exportButton.disabled = false;
            }, 2200);
          },
          {
            binary: true,
            onlyVisible: true,
            trs: false,
            maxTextureSize: 4096
          }
        );
      } catch (error) {
        console.error("GLB export failed:", error);
        exportButton.textContent = "Export Failed";
        setTimeout(() => {
          exportButton.textContent = "Export GLB";
          exportButton.disabled = false;
        }, 1800);
      }
    });
  </script>
</body>
</html>
